<!DOCTYPE html>
<html>
<head>
    <title>Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        #map { 
            height: 100vh; 
            width: 100%; 
        }
        #controls-overlay {
            position: absolute;
            bottom: 20px;
            left: 10px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
            max-width: 300px;
            transition: all 0.3s ease;
        }
        #controls-header {
            padding: 10px;
            cursor: pointer;
            background-color: #4a4a4a;
            color: white;
            border-radius: 5px 5px 0 0;
            text-align: center;
        }
        #controls-content {
            padding: 10px;
            display: none;
            max-height: 60vh;
            overflow-y: auto;
        }
        #controls-content.expanded {
            display: block;
        }
        .control-group {
            margin-bottom: 10px;
        }
        .control-group div {
            margin-bottom: 5px;
        }
        .control-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 2px;
        }
        .control-group input[type="number"] {
            width: 60px;
            padding: 2px;
            font-size: 12px;
        }
        @media (max-width: 768px) {
            #controls-overlay {
                max-width: 250px;
                left: 5px;
                bottom: 10px;
            }
            #parameter-panel {
                left: 60px;
                bottom: 10px;
            }
            #parameter-panel.expanded {
                width: 250px;
            }
            #info-overlay {
                bottom: 5px;
                right: 5px;
                font-size: 9px;
            }
            .control-group label {
                font-size: 11px;
            }
            button {
                font-size: 11px;
                padding: 4px;
            }
        }
        #passwordOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        #passwordForm {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
        }
        #passwordInput {
            width: 100%;
            padding: 5px;
            margin: 10px 0;
            font-size: 16px;
        }
        #loadingModal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 300px;
            text-align: center;
            border-radius: 5px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .leaflet-div-icon {
            background: none;
            border: none;
        }
        .van-icon {
            background: none;
            border: none;
        }
        .van-icon i {
            display: block;
            text-align: center;
            line-height: 30px;
        }
        #parameter-panel {
            position: absolute;
            bottom: 20px;
            left: 70px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
            width: 50px;
            height: 50px;
            transition: all 0.3s ease;
        }
        #parameter-panel.expanded {
            border-radius: 5px;
            width: 280px;
            height: auto;
        }
        #parameter-header {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background-color: #4a4a4a;
            color: white;
            border-radius: 50%;
            font-size: 20px;
            transition: all 0.3s ease;
        }
        #parameter-panel.expanded #parameter-header {
            border-radius: 5px 5px 0 0;
            width: 100%;
            height: 40px;
            font-size: 14px;
        }
        #parameter-content {
            padding: 10px;
            display: none;
            max-height: 60vh;
            overflow-y: auto;
        }
        #parameter-content.expanded {
            display: block;
        }
        #info-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.85);
            color: #333;
            padding: 8px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            z-index: 1000;
            display: none;
            border: 1px solid rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
        }
        #info-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #info-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        #elevation-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }
        #elevation-chart {
            width: 80px;
            height: 60px;
            background: rgba(200, 200, 200, 0.3);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.1);
        }
        #elevation-value {
            font-size: 9px;
            margin-top: 2px;
            text-align: center;
        }
        @media (max-width: 768px) {
            #info-overlay {
                bottom: 10px;
                right: 10px;
                padding: 6px;
                font-size: 10px;
            }
            #info-content {
                gap: 8px;
            }
            #elevation-display {
                min-width: 70px;
            }
            #elevation-chart {
                width: 70px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div id="passwordOverlay">
        <div id="passwordForm">
            <h2>Enter Password</h2>
            <input type="password" id="passwordInput">
            <button onclick="checkPassword()">Submit</button>
        </div>
    </div>
    <div id="loadingModal">
        <div class="modal-content">
            <h2>Calculating Route</h2>
            <div class="spinner"></div>
        </div>
    </div>

    <div id="map"></div>
    <div id="info-overlay">
        <div id="info-content">
            <div id="info-text">
                <div>📅 <span id="current-date">--</span></div>
                <div>🕐 <span id="current-time">--</span></div>
                <div>📏 <span id="total-distance">--</span> km</div>
            </div>
            <div id="elevation-display">
                <div id="elevation-chart"></div>
                <div id="elevation-value"><span id="current-elevation">--</span>m</div>
            </div>
        </div>
    </div>
    <div id="controls-overlay">
        <div id="controls-header" onclick="toggleControls()">
            <i class="fas fa-cog"></i>
        </div>
        <div id="controls-content">
            <div class="control-group">
                <label for="speedRange">Animation Speed: </label>
                <input type="range" id="speedRange" min="1" max="100" value="20" oninput="updateSpeed(this.value)">
                <span id="speedValue">20</span>x speed
            </div>
            <div class="control-group">
                <button onclick="togglePoints()">Show Points</button>
                <button onclick="toggleAnimation()">Start Animation</button>
                <button onclick="toggleRoute()">Show Route</button>
                <button onclick="toggleDriveRoute()">Drive Route</button>
            </div>
            <div class="control-group">
                <label for="startDate">Start Date: </label>
                <input type="date" id="startDate" onchange="updateDateRange()">
            </div>
            <div class="control-group">
                <label for="endDate">End Date: </label>
                <input type="date" id="endDate" onchange="updateDateRange()">
            </div>
            <div class="control-group">
                <button onclick="generateShareLink()">Generate Share Link</button>
                <div id="shareLink"></div>
            </div>
        </div>
    </div>

    <div id="parameter-panel">
        <div id="parameter-header" onclick="toggleParameters()">
            <i class="fas fa-cogs"></i>
        </div>
        <div id="parameter-content">
            <div>
                <label for="maxClusterDistance">Max Cluster Distance (m):</label>
                <input type="number" id="maxClusterDistance" value="1000">
            </div>
            <div>
                <label for="minTimeBetweenPOIs">Min Time Between POIs (min):</label>
                <input type="number" id="minTimeBetweenPOIs" value="15">
            </div>
            <div>
                <label for="sleepingThreshold">Sleeping Threshold (min):</label>
                <input type="number" id="sleepingThreshold" value="360">
            </div>
            <div>
                <label for="parkingThreshold">Parking Threshold (min):</label>
                <input type="number" id="parkingThreshold" value="60">
            </div>
            <div>
                <label for="coffeeBreakThreshold">Coffee Break Threshold (min):</label>
                <input type="number" id="coffeeBreakThreshold" value="20">
            </div>
            <div>
                <label for="maxMergeDistance">Max Merge Distance (m):</label>
                <input type="number" id="maxMergeDistance" value="2000">
            </div>
            <div>
                <label for="maxTimeBetweenMerge">Max Time Between Merge (hours):</label>
                <input type="number" id="maxTimeBetweenMerge" value="24">
            </div>
            <div>
                <label for="roadSnapDistance">Road Snap Distance (m):</label>
                <input type="number" id="roadSnapDistance" value="5000">
            </div>
            <button onclick="updateParameters()">Apply Changes</button>
        </div>
    </div>

    <script>
        var map;
        var routeCoordinates = [];
        var filteredCoordinates = [];
        var poiCoordinates = [];
        var smartPOIs = [];
        var markers = [];
        var speed = 20; // km/s
        var routePath;
        var routeVisible = false;
        var pointsVisible = false;
        var animationRunning = false;
        var currentAnimationIndex = 0;
        var animationTimeout;
        var driveRouteRunning = false;
        var vanMarker;
        var currentPOIIndex = 0;
        var lastUpdateTime = null;
        var stopMarkers = [];
        var homeMarker;
        var totalDistance = 0;
        var lastPosition = null;
        var elevationData = [];
        var currentElevation = 0;

        const OSRM_URL = 'https://router.project-osrm.org/route/v1/driving/';
        const OPENROUTE_URL = 'https://api.openrouteservice.org/v2/directions/driving-car';
        const OPENROUTE_API_KEY = '5b3ce3597851110001cf6248c56af19b19b2427c9486702926df507d';
        const MAX_REQUESTS_PER_SECOND = 1;
        let lastRequestTime = 0;

        const HOME_COORDINATES = [50.7852, 7.0141]; // Coordinates for Altmühlstr., 53332 Bornheim, Germany

        let maxClusterDistance = 1000;
        let minTimeBetweenPOIs = 15 * 60 * 1000;
        let sleepingThreshold = 360;
        let parkingThreshold = 60;
        let coffeeBreakThreshold = 20; // Geändert auf 20 Minuten
        let maxMergeDistance = 2000;
        let maxTimeBetweenMerge = 24 * 60 * 60 * 1000;
        let roadSnapDistance = 5000;

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('passwordOverlay').style.display = 'flex';
            
            const urlParams = new URLSearchParams(window.location.search);
            const startDate = urlParams.get('start');
            const endDate = urlParams.get('end');

            if (startDate) document.getElementById('startDate').value = startDate;
            if (endDate) document.getElementById('endDate').value = endDate;
            
            // POI Parameter aus URL laden
            if (urlParams.get('maxClusterDistance')) {
                maxClusterDistance = parseInt(urlParams.get('maxClusterDistance'));
                document.getElementById('maxClusterDistance').value = maxClusterDistance;
            }
            if (urlParams.get('minTimeBetweenPOIs')) {
                minTimeBetweenPOIs = parseInt(urlParams.get('minTimeBetweenPOIs')) * 60 * 1000; // Convert to ms
                document.getElementById('minTimeBetweenPOIs').value = parseInt(urlParams.get('minTimeBetweenPOIs'));
            }
            if (urlParams.get('sleepingThreshold')) {
                sleepingThreshold = parseInt(urlParams.get('sleepingThreshold'));
                document.getElementById('sleepingThreshold').value = sleepingThreshold;
            }
            if (urlParams.get('parkingThreshold')) {
                parkingThreshold = parseInt(urlParams.get('parkingThreshold'));
                document.getElementById('parkingThreshold').value = parkingThreshold;
            }
            if (urlParams.get('coffeeBreakThreshold')) {
                coffeeBreakThreshold = parseInt(urlParams.get('coffeeBreakThreshold'));
                document.getElementById('coffeeBreakThreshold').value = coffeeBreakThreshold;
            }
            if (urlParams.get('maxMergeDistance')) {
                maxMergeDistance = parseInt(urlParams.get('maxMergeDistance'));
                document.getElementById('maxMergeDistance').value = maxMergeDistance;
            }
            if (urlParams.get('maxTimeBetweenMerge')) {
                maxTimeBetweenMerge = parseInt(urlParams.get('maxTimeBetweenMerge')) * 60 * 60 * 1000; // Convert to ms
                document.getElementById('maxTimeBetweenMerge').value = parseInt(urlParams.get('maxTimeBetweenMerge'));
            }
            if (urlParams.get('roadSnapDistance')) {
                roadSnapDistance = parseInt(urlParams.get('roadSnapDistance'));
                document.getElementById('roadSnapDistance').value = roadSnapDistance;
            }
        });

        function checkPassword() {
            var password = document.getElementById('passwordInput').value;
            if (password === 'thorsten') {
                document.getElementById('passwordOverlay').style.display = 'none';
                initializeMap();
                loadData();
            } else {
                alert('Incorrect password');
            }
        }

        function initializeMap() {
            map = L.map('map').setView(HOME_COORDINATES, 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            // Add home marker
            homeMarker = L.marker(HOME_COORDINATES, {
                icon: L.divIcon({
                    className: 'custom-div-icon',
                    html: '<div style="background-color:#FF5733;color:white;width:30px;height:30px;display:flex;justify-content:center;align-items:center;border-radius:50%;"><i class="fas fa-home"></i></div>',
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                })
            }).addTo(map);
        }

        function loadData() {
            Papa.parse('https://docs.google.com/spreadsheets/d/13nN8lisfKRQHbD66J2pg1k5jN9lFz15ijwx0obu-03o/pub?gid=0&single=true&output=csv', {
                download: true,
                header: true,
                complete: function(results) {
                    routeCoordinates = results.data
                        .map(row => ({
                            lat: parseFloat(row.lat),
                            lon: parseFloat(row.lon),
                            time: new Date(row.time)
                        }))
                        .filter(point => !isNaN(point.lat) && !isNaN(point.lon) && !isNaN(point.time.getTime()))
                        .sort((a, b) => a.time - b.time);

                    identifyPOIs(routeCoordinates);
                    createSmartPOIs();
                    updateDateRange();

                    document.getElementById('speedRange').value = speed;
                    document.getElementById('speedValue').textContent = speed;

                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.get('autoplay') === 'true') {
                        setTimeout(() => {
                            startDriveRoute();
                        }, 1000);
                    }

                    // Debug information
                    console.log(`Total waypoints: ${routeCoordinates.length}`);
                    console.log(`Total POIs: ${poiCoordinates.length}`);
                    console.log(`Smart POIs: ${smartPOIs.length}`);
                    console.log('POIs by class:', poiCoordinates.reduce((acc, poi) => {
                        acc[poi.stopType] = (acc[poi.stopType] || 0) + 1;
                        return acc;
                    }, {}));
                }
            });
        }

        function toggleControls() {
            var content = document.getElementById('controls-content');
            content.classList.toggle('expanded');
        }

        function collapseControls() {
            var content = document.getElementById('controls-content');
            content.classList.remove('expanded');
        }

        function updateSpeed(value) {
            document.getElementById('speedValue').textContent = value;
            speed = parseInt(value);
        }

        function updateDateRange() {
            let startDate = document.getElementById('startDate').value;
            let endDate = document.getElementById('endDate').value;
            
            // Filtere die Koordinaten
            if (!startDate && !endDate) {
                filteredCoordinates = [...routeCoordinates];
                console.log("Using all coordinates - no date filter applied");
            } else {
                filteredCoordinates = filterRouteByDateRange(startDate, endDate);
                console.log("Applied date filter:", startDate, "to", endDate);
            }
            
            // Filtere die POIs - verwende immer die originalen identifizierten POIs
            if (!startDate && !endDate) {
                // Verwende alle Smart POIs wenn keine Filter gesetzt sind
                poiCoordinates = [...smartPOIs];
            } else {
                // Filtere Smart POIs nach Datum
                poiCoordinates = smartPOIs.filter(poi => {
                    if (!startDate && !endDate) return true;
                    let start = startDate ? new Date(startDate) : new Date(0);
                    let end = endDate ? new Date(endDate) : new Date();
                    return poi.time >= start && poi.time <= end;
                });
            }
            
            // Clear existing markers and path
            clearMap();

            // Redraw points if they were visible
            if (pointsVisible) {
                showPoints();
            }

            // Redraw route if it was visible
            if (routeVisible) {
                showRoute();
            }

            // Debug information
            console.log(`Filtered waypoints: ${filteredCoordinates.length}`);
            console.log(`Filtered POIs: ${poiCoordinates.length}`);
            console.log('Filtered POIs by class:', poiCoordinates.reduce((acc, poi) => {
                acc[poi.stopType] = (acc[poi.stopType] || 0) + 1;
                return acc;
            }, {}));
            
            // Debug POI details
            poiCoordinates.forEach((poi, i) => {
                console.log(`POI ${i+1}: ${poi.stopType} at ${poi.time.toLocaleString()} (${poi.lat.toFixed(6)}, ${poi.lon.toFixed(6)})`);
            });
        }

        function clearMap() {
            if (routePath) map.removeLayer(routePath);
            markers.forEach(marker => map.removeLayer(marker));
            stopMarkers.forEach(marker => map.removeLayer(marker));
            markers = [];
            stopMarkers = [];
        }

        function togglePoints() {
            pointsVisible = !pointsVisible;
            if (pointsVisible) showPoints();
            else hidePoints();
            collapseControls();
        }

        function showPoints() {
            hidePoints();
            filteredCoordinates.forEach(function(point) {
                var marker = L.marker([point.lat, point.lon]).addTo(map)
                    .bindPopup(point.time.toLocaleString());
                markers.push(marker);
            });

            poiCoordinates.forEach(function(poi) {
                addStopMarker(poi);
            });

            if (filteredCoordinates.length > 0) {
                map.fitBounds(L.latLngBounds(filteredCoordinates.map(point => [point.lat, point.lon])));
            }
        }

        function hidePoints() {
            markers.forEach(marker => map.removeLayer(marker));
            stopMarkers.forEach(marker => map.removeLayer(marker));
            markers = [];
            stopMarkers = [];
        }

        function toggleAnimation() {
            if (animationRunning) stopAnimation();
            else startAnimation();
            collapseControls();
        }

        function startAnimation() {
            if (routePath) map.removeLayer(routePath);
            routePath = L.polyline([], {color: 'blue'}).addTo(map);
            animationRunning = true;
            currentAnimationIndex = 0;
            document.querySelector('button[onclick="toggleAnimation()"]').textContent = "Stop Animation";
            animateRoute(currentAnimationIndex);
        }

        function stopAnimation() {
            animationRunning = false;
            clearTimeout(animationTimeout);
            document.querySelector('button[onclick="toggleAnimation()"]').textContent = "Start Animation";
        }

        function toggleRoute() {
            routeVisible = !routeVisible;
            if (routeVisible) showRoute();
            else if (routePath) {
                map.removeLayer(routePath);
                stopMarkers.forEach(marker => map.removeLayer(marker));
                stopMarkers = [];
            }
            collapseControls();
        }

        function showRoute() {
            if (routePath) map.removeLayer(routePath);
            calculateCompleteRoute();
        }

        function animateRoute(i) {
            if (i < filteredCoordinates.length && animationRunning) {
                var point = filteredCoordinates[i];
                var marker = L.marker([point.lat, point.lon]).addTo(map)
                    .bindPopup(point.time.toLocaleString())
                    .openPopup();
                markers.push(marker);

                routePath.addLatLng([point.lat, point.lon]);
                map.setView([point.lat, point.lon]);

                let poi = poiCoordinates.find(p => p.lat === point.lat && p.lon === point.lon);
                if (poi) {
                    addStopMarker(poi);
                }

                animationTimeout = setTimeout(function() {
                    animateRoute(i + 1);
                }, 1000);
            } else if (i >= filteredCoordinates.length) {
                stopAnimation();
            }
        }

        function toggleDriveRoute() {
            if (driveRouteRunning) stopDriveRoute();
            else startDriveRoute();
            collapseControls();
        }

        function startDriveRoute() {
            document.getElementById('loadingModal').style.display = 'block';
            document.getElementById('info-overlay').style.display = 'block';
            if (routePath) map.removeLayer(routePath);
            routePath = L.polyline([], {color: 'blue'}).addTo(map);
            
            // Van Marker richtig zurücksetzen
            if (vanMarker) {
                map.removeLayer(vanMarker);
                vanMarker = null;
            }
            
            driveRouteRunning = true;
            totalDistance = 0;
            lastPosition = null;
            elevationData = [];
            currentPOIIndex = 0;
            lastUpdateTime = null;
            document.querySelector('button[onclick="toggleDriveRoute()"]').textContent = "Stop Driving";
            calculateCompleteRoute();
        }

        function stopDriveRoute() {
            driveRouteRunning = false;
            clearTimeout(animationTimeout);
            document.getElementById('info-overlay').style.display = 'none';
            document.querySelector('button[onclick="toggleDriveRoute()"]').textContent = "Drive Route";
            if (vanMarker) map.removeLayer(vanMarker);
            
            // Füge alle verpassten POIs hinzu
            addMissedPOIs();
            
            console.log("Total POIs displayed during drive:", stopMarkers.length);
            console.log("POIs displayed by type:", stopMarkers.reduce((acc, marker) => {
                let type = marker.options.icon.options.html.includes('fa-coffee') ? 'Coffee Break' :
                           marker.options.icon.options.html.includes('fa-parking') ? 'Parking' :
                           marker.options.icon.options.html.includes('fa-campground') ? 'Sleeping' :
                           marker.options.icon.options.html.includes('fa-home') ? 'Home' : 'Other';
                acc[type] = (acc[type] || 0) + 1;
                return acc;
            }, {}));
        }

        // Funktion zum Hinzufügen verpasster POIs am Ende der Route
        function addMissedPOIs() {
            console.log("Checking for missed POIs...");
            for (let poi of poiCoordinates) {
                let alreadyDisplayed = stopMarkers.some(m => 
                    calculateDistance(m.getLatLng().lat, m.getLatLng().lng, poi.lat, poi.lon) < 500
                );
                
                if (!alreadyDisplayed) {
                    console.log(`Adding missed POI: ${poi.stopType} at ${poi.lat.toFixed(6)}, ${poi.lon.toFixed(6)}`);
                    addStopMarker(poi);
                }
            }
        }

        async function getRouteFromOSRM(points) {
            const cacheKey = `route_${points[0].lat},${points[0].lon}_${points[1].lat},${points[1].lon}`;
            const cachedRoute = await localforage.getItem(cacheKey);
            
            if (cachedRoute) {
                return cachedRoute;
            }

            await throttleRequest();

            const coordinates = points.map(p => `${p.lon},${p.lat}`).join(';');
            const url = `${OSRM_URL}${coordinates}?overview=full&geometries=geojson&continue_straight=true`;

            console.log(`Requesting route from OSRM: ${url}`);

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('OSRM request failed');
                }
                const data = await response.json();
                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);
                    await localforage.setItem(cacheKey, route);
                    return route;
                }
            } catch (error) {
                console.error('Error fetching route from OSRM:', error);
                return getRouteFromOpenRoute(points);
            }
        }

        async function getRouteFromOpenRoute(points) {
            const cacheKey = `openroute_${points[0].lat},${points[0].lon}_${points[1].lat},${points[1].lon}`;
            const cachedRoute = await localforage.getItem(cacheKey);
            
            if (cachedRoute) {
                return cachedRoute;
            }

            await throttleRequest();

            const body = {
                coordinates: points.map(p => [p.lon, p.lat])
            };

            console.log(`Requesting route from OpenRoute: ${JSON.stringify(body)}`);

            try {
                const response = await fetch(OPENROUTE_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': OPENROUTE_API_KEY
                    },
                    body: JSON.stringify(body)
                });

                if (!response.ok) {
                    throw new Error('OpenRoute request failed');
                }

                const data = await response.json();
                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);
                    await localforage.setItem(cacheKey, route);
                    return route;
                }
            } catch (error) {
                console.error('Error fetching route from OpenRoute:', error);
                throw error;
            }
        }

        async function throttleRequest() {
            const now = Date.now();
            const timeSinceLastRequest = now - lastRequestTime;
            const timeToWait = Math.max(0, 1000 / MAX_REQUESTS_PER_SECOND - timeSinceLastRequest);
            
            if (timeToWait > 0) {
                await new Promise(resolve => setTimeout(resolve, timeToWait));
            }
            
            lastRequestTime = Date.now();
        }

        // Verbesserte Route-Berechnung die ALLE POIs einschließt
        async function calculateCompleteRoute() {
            let completeRoute = [];
            let routePOIs = poiCoordinates.length > 0 ? [...poiCoordinates] : [...smartPOIs];

            // Stelle sicher, dass wir mit Home starten und enden
            if (routePOIs.length > 0) {
                // Füge Home am Anfang hinzu, falls nicht bereits da
                let firstPOI = routePOIs[0];
                if (calculateDistance(HOME_COORDINATES[0], HOME_COORDINATES[1], firstPOI.lat, firstPOI.lon) > 1000) {
                    routePOIs.unshift({
                        lat: HOME_COORDINATES[0],
                        lon: HOME_COORDINATES[1],
                        time: new Date(firstPOI.time.getTime() - 60*60*1000), // 1 Stunde früher
                        endTime: new Date(firstPOI.time.getTime() - 60*60*1000),
                        stopType: 'Home'
                    });
                }

                // Füge Home am Ende hinzu, falls nicht bereits da
                let lastPOI = routePOIs[routePOIs.length - 1];
                if (calculateDistance(HOME_COORDINATES[0], HOME_COORDINATES[1], lastPOI.lat, lastPOI.lon) > 1000) {
                    routePOIs.push({
                        lat: HOME_COORDINATES[0],
                        lon: HOME_COORDINATES[1],
                        time: new Date(lastPOI.endTime.getTime() + 60*60*1000), // 1 Stunde später
                        endTime: new Date(lastPOI.endTime.getTime() + 60*60*1000),
                        stopType: 'Home'
                    });
                }
            }

            console.log("Complete POI route including home:", routePOIs);

            try {
                for (let i = 0; i < routePOIs.length - 1; i++) {
                    let start = routePOIs[i];
                    let end = routePOIs[i + 1];
                    console.log(`Calculating route from ${start.stopType || 'POI'} at ${start.lat},${start.lon} to ${end.stopType || 'POI'} at ${end.lat},${end.lon}`);
                    let route = await getRouteFromOSRM([start, end]);
                    if (route && route.length > 0) {
                        completeRoute = completeRoute.concat(route);
                    }
                }

                console.log("Complete route calculated, total points:", completeRoute.length);

                document.getElementById('loadingModal').style.display = 'none';
                if (completeRoute.length > 0) {
                    animateVanAlongRoute(completeRoute, 0, routePOIs);
                } else {
                    alert('Could not calculate route. Please try again.');
                    stopDriveRoute();
                }
            } catch (error) {
                console.error('Error calculating route:', error);
                alert('An error occurred while calculating the route. Please try again later.');
                document.getElementById('loadingModal').style.display = 'none';
                stopDriveRoute();
            }
        }

        // Komplett überarbeitete Animation mit echter Zeit basierend auf POI-Erreichen
        function animateVanAlongRoute(route, step, routePOIs) {
            if (step < route.length && driveRouteRunning) {
                var point = route[step];
                
                // Zeit-Update nur bei POI-Erreichen oder Initialisierung
                var currentTime = updateTimeBasedOnPOIs(point);

                if (!vanMarker) {
                    vanMarker = L.marker(point, {
                        icon: L.divIcon({
                            className: 'van-icon',
                            iconSize: [30, 30],
                            iconAnchor: [15, 15],
                            html: '<div style="background-color:#4a4a4a;color:white;width:30px;height:30px;display:flex;justify-content:center;align-items:center;border-radius:50%;"><i class="fas fa-shuttle-van"></i></div>'
                        })
                    }).addTo(map);
                } else {
                    vanMarker.setLatLng(point);
                }
                routePath.addLatLng(point);
                map.setView(point);

                // Update distance tracking
                if (lastPosition) {
                    totalDistance += calculateDistance(lastPosition[0], lastPosition[1], point[0], point[1]) / 1000; // km
                }
                lastPosition = point;

                // POI-Erkennung
                for (let poi of poiCoordinates) {
                    let distance = calculateDistance(poi.lat, poi.lon, point[0], point[1]);
                    
                    if (distance < 1000) {
                        let alreadyDisplayed = stopMarkers.some(m => 
                            calculateDistance(m.getLatLng().lat, m.getLatLng().lng, poi.lat, poi.lon) < 500
                        );
                        
                        if (!alreadyDisplayed) {
                            console.log(`Reached POI: ${poi.stopType} at distance ${distance.toFixed(0)}m`);
                            addStopMarker(poi);
                        }
                    }
                }

                // Update info overlay
                updateInfoOverlay(point, currentTime, step, route.length);

                currentAnimationIndex = step;
                
                var timeToNextPoint = calculateTimeToNextPoint(point, route[step + 1] || point);
                animationTimeout = setTimeout(function() {
                    animateVanAlongRoute(route, step + 1, routePOIs);
                }, timeToNextPoint);
            } else if (step >= route.length && driveRouteRunning) {
                console.log("Route completed!");
                setTimeout(stopDriveRoute, 2000);
            }
        }

        // Neue Funktion für POI-basierte Zeit-Updates
        function updateTimeBasedOnPOIs(currentPoint) {
            // Finde den nächsten POI
            for (let i = currentPOIIndex; i < poiCoordinates.length; i++) {
                let poi = poiCoordinates[i];
                let distance = calculateDistance(poi.lat, poi.lon, currentPoint[0], currentPoint[1]);
                
                if (distance < 1000) {
                    // POI erreicht - aktualisiere Zeit
                    currentPOIIndex = i;
                    lastUpdateTime = poi.time;
                    console.log(`Time updated to POI ${i}: ${poi.time.toLocaleString('de-DE')}`);
                    return poi.time;
                }
            }
            
            // Kein POI erreicht - verwende letzte bekannte Zeit oder erste Zeit
            if (lastUpdateTime) {
                return lastUpdateTime;
            } else if (filteredCoordinates.length > 0) {
                return filteredCoordinates[0].time;
            } else {
                return new Date();
            }
        }

        function updateElevationChart() {
            let chart = document.getElementById('elevation-chart');
            let canvas = chart.querySelector('canvas');
            if (!canvas) {
                canvas = document.createElement('canvas');
                canvas.width = 80;
                canvas.height = 60;
                chart.appendChild(canvas);
            }
            
            let ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 80, 60);
            
            if (elevationData.length > 1) {
                // Adaptive Skalierung basierend auf den letzten Werten
                const minElev = Math.min(...elevationData);
                const maxElev = Math.max(...elevationData);
                const range = Math.max(maxElev - minElev, 50); // Minimum 50m Range für Sichtbarkeit
                const center = (minElev + maxElev) / 2;
                const displayMin = center - range / 2;
                const displayMax = center + range / 2;
                
                // Zeichne subtiles Gitternetz
                ctx.strokeStyle = 'rgba(150, 150, 150, 0.2)';
                ctx.lineWidth = 0.5;
                for (let i = 1; i < 4; i++) {
                    const y = (i / 4) * 60;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(80, y);
                    ctx.stroke();
                }
                
                // Zeichne Elevation-Kurve
                ctx.strokeStyle = '#2196F3';
                ctx.lineWidth = 2;
                ctx.beginPath();
                
                for (let i = 0; i < elevationData.length; i++) {
                    let x = (i / (elevationData.length - 1)) * 80;
                    let y = 60 - ((elevationData[i] - displayMin) / range) * 60;
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
                
                // Zeichne gefüllte Fläche unter der Kurve
                ctx.fillStyle = 'rgba(33, 150, 243, 0.1)';
                ctx.beginPath();
                ctx.moveTo(0, 60);
                for (let i = 0; i < elevationData.length; i++) {
                    let x = (i / (elevationData.length - 1)) * 80;
                    let y = 60 - ((elevationData[i] - displayMin) / range) * 60;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(80, 60);
                ctx.closePath();
                ctx.fill();
                
                // Zeichne aktuellen Punkt (letzter Wert)
                if (elevationData.length > 0) {
                    const currentX = 78;
                    const currentY = 60 - ((elevationData[elevationData.length - 1] - displayMin) / range) * 60;
                    
                    ctx.fillStyle = '#FF5722';
                    ctx.beginPath();
                    ctx.arc(currentX, currentY, 2.5, 0, 2 * Math.PI);
                    ctx.fill();
                }
                
                // Zeige Höhenänderung als Text
                const heightChange = elevationData[elevationData.length - 1] - elevationData[0];
                const changeText = heightChange >= 0 ? `+${heightChange.toFixed(0)}m` : `${heightChange.toFixed(0)}m`;
                
                ctx.fillStyle = heightChange >= 0 ? '#4CAF50' : '#F44336';
                ctx.font = '9px monospace';
                ctx.fillText(changeText, 2, 12);
            }
        }

        function calculateTimeToNextPoint(point1, point2) {
            var distance = calculateDistance(point1[0], point1[1], point2[0], point2[1]);
            // speed ist in km/s, konvertiere zu m/s und dann zu ms
            var speedMs = speed * 1000; // km/s zu m/s
            var timeInSeconds = distance / speedMs;
            return Math.max(10, timeInSeconds * 1000); // Minimum 10ms, sonst echte Zeit in ms
        }

        function filterRouteByDateRange(startDate, endDate) {
            if (!startDate && !endDate) return routeCoordinates;
            if (!startDate) startDate = new Date(0); // Unix epoch
            if (!endDate) endDate = new Date(); // Now
            
            return routeCoordinates.filter(point => {
                return point.time >= new Date(startDate) && point.time <= new Date(endDate);
            });
        }

        function filterPOIsByDateRange(startDate, endDate) {
            let poisToFilter = smartPOIs.length > 0 ? smartPOIs : poiCoordinates;
            
            if (!startDate && !endDate) return poisToFilter;
            if (!startDate) startDate = new Date(0); // Unix epoch
            if (!endDate) endDate = new Date(); // Now
            
            return poisToFilter.filter(point => {
                return point.time >= new Date(startDate) && point.time <= new Date(endDate);
            });
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Radius of the Earth in meters
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; // Distance in meters
        }

        function classifyStop(timeDiff) {
            console.log(`Classifying stop with duration: ${timeDiff.toFixed(2)} minutes`);
            if (timeDiff >= sleepingThreshold) {
                return 'Sleeping';
            } else if (timeDiff >= parkingThreshold) {
                return 'Parking';
            } else if (timeDiff >= coffeeBreakThreshold) {
                return 'Coffee Break';
            }
            return 'Moving';
        }

        // Verbesserte Smart POI Erstellung
        function createSmartPOIs() {
            if (poiCoordinates.length === 0) {
                console.log("No POIs found for Smart POI creation");
                return;
            }
            
            smartPOIs = [];
            
            console.log(`Creating Smart POIs from ${poiCoordinates.length} original POIs`);
            
            // Alle POIs durchgehen (nicht nur die mit mindestens Coffee Break Dauer)
            for (let poi of poiCoordinates) {
                let nearbyPoints = routeCoordinates.filter(point => {
                    let distance = calculateDistance(poi.lat, poi.lon, point.lat, point.lon);
                    let timeDiff = Math.abs(point.time - poi.time);
                    return distance < roadSnapDistance && timeDiff < 2 * 60 * 60 * 1000; // 2 Stunden Toleranz
                });
                
                if (nearbyPoints.length > 0) {
                    // Finde den zeitlich nächsten Punkt
                    let bestPoint = nearbyPoints.reduce((best, current) => {
                        let currentTimeDiff = Math.abs(current.time - poi.time);
                        let bestTimeDiff = Math.abs(best.time - poi.time);
                        return currentTimeDiff < bestTimeDiff ? current : best;
                    });
                    
                    // Erstelle Smart POI mit besserer Position
                    let smartPOI = {
                        ...poi,
                        lat: bestPoint.lat,
                        lon: bestPoint.lon,
                        originalLat: poi.lat,
                        originalLon: poi.lon,
                        snapDistance: calculateDistance(poi.lat, poi.lon, bestPoint.lat, bestPoint.lon),
                        isSnapped: true
                    };
                    
                    smartPOIs.push(smartPOI);
                    console.log(`Smart POI created: ${poi.stopType} (${((poi.endTime - poi.time) / (60 * 1000)).toFixed(0)}min) snapped ${smartPOI.snapDistance.toFixed(0)}m to road`);
                } else {
                    // Kein besserer Punkt gefunden, originalen POI verwenden
                    let originalPOI = {...poi, isSnapped: false};
                    smartPOIs.push(originalPOI);
                    console.log(`Smart POI kept original: ${poi.stopType} (no nearby route points found)`);
                }
            }
            
            // Sortiere Smart POIs nach Zeit
            smartPOIs.sort((a, b) => a.time - b.time);
            
            console.log(`Created ${smartPOIs.length} smart POIs:`);
            smartPOIs.forEach((poi, i) => {
                console.log(`  ${i+1}. ${poi.stopType} at ${poi.time.toLocaleString()} (${poi.isSnapped ? 'snapped' : 'original'})`);
            });
        }

        function identifyPOIs(points) {
            console.log("Starting POI identification with", points.length, "points");
            poiCoordinates = [];
            let currentCluster = [];

            for (let i = 0; i < points.length; i++) {
                const currentPoint = points[i];
                const nextPoint = points[i + 1];

                currentCluster.push(currentPoint);

                if (nextPoint) {
                    const distance = calculateDistance(currentPoint.lat, currentPoint.lon, nextPoint.lat, nextPoint.lon);
                    const timeDiff = nextPoint.time - currentPoint.time;

                    console.log(`Point ${i}: Distance to next = ${distance.toFixed(2)}m, Time diff = ${(timeDiff/60000).toFixed(2)}min`);

                    if (distance > maxClusterDistance || timeDiff > minTimeBetweenPOIs) {
                        // End of cluster, classify it
                        const clusterDuration = currentCluster[currentCluster.length - 1].time - currentCluster[0].time;
                        const stopType = classifyStop(clusterDuration / (60 * 1000)); // Convert to minutes

                        console.log(`Cluster ended. Duration: ${(clusterDuration/60000).toFixed(2)}min, Type: ${stopType}`);

                        if (stopType !== 'Moving') {
                            const avgLat = currentCluster.reduce((sum, p) => sum + p.lat, 0) / currentCluster.length;
                            const avgLon = currentCluster.reduce((sum, p) => sum + p.lon, 0) / currentCluster.length;
                            const maxDistanceInCluster = Math.max(...currentCluster.map(p => 
                                calculateDistance(avgLat, avgLon, p.lat, p.lon)
                            ));

                            const firstPoint = currentCluster[0];
                            const newPOI = {
                                lat: firstPoint.lat,
                                lon: firstPoint.lon,
                                time: currentCluster[0].time,
                                endTime: currentCluster[currentCluster.length - 1].time,
                                stopType: stopType,
                                visitCount: 1,
                                clusterSize: currentCluster.length,
                                maxDistanceInCluster: maxDistanceInCluster,
                                timeToNextPOI: timeDiff,
                                distanceToNextPOI: distance
                            };
                            
                            if (poiCoordinates.length > 0) {
                                const lastPOI = poiCoordinates[poiCoordinates.length - 1];
                                lastPOI.timeToNextPOI = newPOI.time - lastPOI.endTime;
                                lastPOI.distanceToNextPOI = calculateDistance(lastPOI.lat, lastPOI.lon, newPOI.lat, newPOI.lon);
                            }
                            
                            poiCoordinates.push(newPOI);
                            console.log(`POI added: ${stopType} at ${avgLat.toFixed(6)}, ${avgLon.toFixed(6)}`);
                        }

                        currentCluster = [currentPoint]; // Start new cluster with current point
                    }
                }
            }

            // Handle the last cluster
            if (currentCluster.length > 0) {
                const clusterDuration = currentCluster[currentCluster.length - 1].time - currentCluster[0].time;
                const stopType = classifyStop(clusterDuration / (60 * 1000));
                console.log(`Last cluster. Duration: ${(clusterDuration/60000).toFixed(2)}min, Type: ${stopType}`);
                if (stopType !== 'Moving') {
                    const avgLat = currentCluster.reduce((sum, p) => sum + p.lat, 0) / currentCluster.length;
                    const avgLon = currentCluster.reduce((sum, p) => sum + p.lon, 0) / currentCluster.length;
                    const maxDistanceInCluster = Math.max(...currentCluster.map(p => 
                        calculateDistance(avgLat, avgLon, p.lat, p.lon)
                    ));
                    poiCoordinates.push({
                        lat: avgLat,
                        lon: avgLon,
                        time: currentCluster[0].time,
                        endTime: currentCluster[currentCluster.length - 1].time,
                        stopType: stopType,
                        visitCount: 1,
                        clusterSize: currentCluster.length,
                        maxDistanceInCluster: maxDistanceInCluster,
                        timeToNextPOI: 0,
                        distanceToNextPOI: 0
                    });
                    console.log(`Last POI added: ${stopType} at ${avgLat.toFixed(6)}, ${avgLon.toFixed(6)}`);
                }
            }

            // Merge nearby POIs of the same type
            poiCoordinates = mergeSimilarPOIs(poiCoordinates);

            // Debug information
            console.log(`Total POIs identified: ${poiCoordinates.length}`);
            console.log('POIs by class:', poiCoordinates.reduce((acc, poi) => {
                acc[poi.stopType] = (acc[poi.stopType] || 0) + 1;
                return acc;
            }, {}));
        }

        function mergeSimilarPOIs(pois) {
            const mergedPOIs = [];

            for (let poi of pois) {
                const similarPOI = mergedPOIs.find(p => 
                    p.stopType === poi.stopType && 
                    calculateDistance(p.lat, p.lon, poi.lat, poi.lon) < maxMergeDistance &&
                    Math.abs(p.endTime - poi.time) < maxTimeBetweenMerge
                );

                if (similarPOI) {
                    const newEndTime = Math.max(similarPOI.endTime, poi.endTime);
                    const totalDuration = (newEndTime - similarPOI.time) / (60 * 1000); // in minutes

                    similarPOI.endTime = newEndTime;
                    similarPOI.visitCount++;
                    similarPOI.clusterSize += poi.clusterSize;
                    similarPOI.maxDistanceInCluster = Math.max(similarPOI.maxDistanceInCluster, poi.maxDistanceInCluster);

                    // Re-evaluate the stop type based on the total duration
                    similarPOI.stopType = classifyStop(totalDuration);
                } else {
                    mergedPOIs.push(poi);
                }
            }

            return mergedPOIs;
        }

        function updateParameters() {
            maxClusterDistance = Number(document.getElementById('maxClusterDistance').value);
            minTimeBetweenPOIs = Number(document.getElementById('minTimeBetweenPOIs').value) * 60 * 1000; // Convert to milliseconds
            sleepingThreshold = Number(document.getElementById('sleepingThreshold').value);
            parkingThreshold = Number(document.getElementById('parkingThreshold').value);
            coffeeBreakThreshold = Number(document.getElementById('coffeeBreakThreshold').value);
            maxMergeDistance = Number(document.getElementById('maxMergeDistance').value);
            maxTimeBetweenMerge = Number(document.getElementById('maxTimeBetweenMerge').value) * 60 * 60 * 1000; // Convert to milliseconds
            roadSnapDistance = Number(document.getElementById('roadSnapDistance').value);

            // Re-run POI identification and update the map
            identifyPOIs(routeCoordinates);
            createSmartPOIs();
            updateDateRange(); // This will redraw the map with the new POIs
            console.log("Parameters updated and POIs recalculated");
        }
    </script>
