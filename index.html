<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Van-Spur</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#f4f4f1; --panel:#ffffff; --panel2:#fafaf8; --line:#e2e2dc; --text:#22221e;
    --dim:#75756c; --akzent:#3d7a4e; --akzent-hell:#4d9463;
    --fahrt:#2f6fb0; --pause:#d4941f; --halt:#cc6a2c; --nacht:#6b52b5; --tage:#a33b3b;
    --schatten:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.10);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#15161a; --panel:#1e2025; --panel2:#24262c; --line:#32353d; --text:#e9e9e4;
           --dim:#9b9b93; --akzent:#4d9463; --akzent-hell:#5fa876;
           --schatten:0 1px 3px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45); }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;
       color:var(--text);background:var(--bg);overflow:hidden}
  #map{position:absolute;inset:0;background:var(--bg)}

  /* Abdunkeln auf der ganzen Kachelebene, nicht je Kachel. Pro Kachel blieben
     beim Nachladen einzelne Felder in der falschen Helligkeit stehen. */
  @media (prefers-color-scheme:dark){
    .leaflet-tile-pane{filter:invert(.92) hue-rotate(180deg) brightness(.95) contrast(.86) saturate(.7)}
  }
  .karte{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--schatten)}

  /* Bedienfeld */
  #steuer{position:absolute;z-index:600;top:14px;left:14px;width:290px;max-height:calc(100% - 28px);
          display:flex;flex-direction:column;overflow:hidden}
  #steuerkopf{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);
              cursor:pointer;user-select:none;background:var(--panel2);border-radius:14px 14px 0 0}
  #steuerkopf b{font-size:14px;font-weight:600;flex:1}
  #steuerkopf .pfeil{color:var(--dim);transition:transform .2s}
  #steuer.zu .pfeil{transform:rotate(-90deg)}
  #steuer.zu #steuerkoerper{display:none}
  #steuer.zu #steuerkopf{border-bottom:none;border-radius:14px}
  #steuerkoerper{padding:12px 14px 14px;overflow:auto}
  .feld{margin-bottom:13px}
  .feld:last-child{margin-bottom:0}
  .feld label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px;font-weight:500}
  .zeile{display:flex;gap:8px}
  input[type=date]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;
                   background:var(--panel2);color:var(--text);width:100%;min-width:0}
  input[type=range]{width:100%;accent-color:var(--akzent);margin:2px 0}
  .knopf{font:inherit;font-weight:500;padding:9px 12px;border:1px solid transparent;border-radius:9px;
         background:var(--akzent);color:#fff;cursor:pointer;width:100%;transition:background .15s}
  .knopf:hover{background:var(--akzent-hell)}
  .knopf:disabled{opacity:.45;cursor:default}
  .knopf.still{background:var(--panel2);color:var(--text);border-color:var(--line)}
  .knopf.still:hover{background:var(--line)}
  .knopf.still.an{background:var(--akzent);color:#fff;border-color:transparent}
  .knopf+.knopf{margin-top:7px}
  .wert{font-variant-numeric:tabular-nums;color:var(--text);font-weight:600}

  /* Zahlenleiste */
  #zahlen{position:absolute;z-index:600;top:14px;left:318px;right:14px;padding:9px 14px;
          font-size:13px;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  #zahlen b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

  #hinweis{position:absolute;z-index:600;left:50%;transform:translateX(-50%);top:70px;
           padding:9px 16px;font-size:13px;color:var(--dim)}
  #hinweis b{color:var(--text);font-weight:600}
  @media (max-width:820px){ #hinweis{left:14px;right:14px;transform:none;top:auto;bottom:86px} }

  /* Aufenthaltsliste */
  #liste{position:absolute;z-index:600;right:14px;bottom:14px;width:320px;
         max-height:min(52vh,560px);display:flex;flex-direction:column;overflow:hidden}
  #listekopf{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2);
             border-radius:14px 14px 0 0;font-size:13px;font-weight:600}
  #listekoerper{overflow:auto;padding:4px 0}
  .halt{display:flex;gap:9px;align-items:baseline;padding:7px 14px;cursor:pointer}
  .halt:hover{background:var(--panel2)}
  .halt.aktiv{background:var(--panel2);box-shadow:inset 3px 0 0 var(--akzent)}
  .poi{border-radius:50%;background:var(--c);border:2px solid #fff;
       box-shadow:0 1px 4px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.06);
       display:flex;align-items:center;justify-content:center;box-sizing:border-box}
  .poi svg{width:64%;height:64%;fill:none;stroke:#fff;stroke-width:1.9;
           stroke-linecap:round;stroke-linejoin:round;overflow:visible}
  .poi.neu{animation:poppen .34s cubic-bezier(.34,1.56,.64,1)}
  @keyframes poppen{from{transform:scale(.1);opacity:0}60%{opacity:1}to{transform:scale(1)}}
  .poi.mini{width:18px;height:18px;border-width:1.5px;flex:0 0 auto;align-self:center;
            box-shadow:none;margin-right:1px}
  .poi.mini svg{stroke-width:2.4}
  .punkt{width:10px;height:10px;border-radius:50%;flex:0 0 auto;align-self:center}
  .halt .zeit{color:var(--dim);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .halt .was{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .halt .dauer{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .legende{display:flex;gap:11px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);padding:8px 14px 4px}
  .legende span{display:flex;gap:5px;align-items:center}

  /* Fahrtanzeige */
  #fahrt{position:absolute;z-index:600;left:50%;transform:translateX(-50%);bottom:14px;
         padding:10px 18px;display:none;gap:20px;align-items:center;font-variant-numeric:tabular-nums}
  #fahrt.an{display:flex}
  #fahrt .gross{font-size:16px;font-weight:600}
  #fahrt .klein{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}

  /* Ladeschirm und Tor */
  #lade,#tor{position:absolute;inset:0;z-index:1000;background:var(--bg);display:flex;
             align-items:center;justify-content:center;flex-direction:column;gap:14px}
  #lade{z-index:900}
  .balken{width:240px;height:4px;background:var(--line);border-radius:3px;overflow:hidden}
  .balken i{display:block;height:100%;width:0;background:var(--akzent);transition:width .25s}
  #tor input{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:9px;
             background:var(--panel);color:var(--text);width:210px;text-align:center}
  #tor .knopf{width:210px}
  .fehler{color:var(--tage);max-width:420px;text-align:center;padding:0 20px}

  .van-icon{font-size:22px;line-height:1;position:relative;
            filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
  .van-icon::before{content:'';position:absolute;left:50%;top:50%;width:34px;height:34px;
            margin:-17px 0 0 -17px;border-radius:50%;background:var(--fahrt);opacity:.22;
            animation:puls 1.6s ease-out infinite}
  @keyframes puls{0%{transform:scale(.55);opacity:.35}70%{transform:scale(1.25);opacity:0}100%{opacity:0}}

  @media (max-width:820px){
    #steuer{width:auto;right:14px}
    #zahlen{left:14px;right:14px;top:auto;bottom:14px;font-size:12px;gap:10px}
    #liste{display:none}
    #fahrt{left:14px;right:14px;transform:none;bottom:70px;justify-content:space-between;gap:10px}
    #fahrt .gross{font-size:14px}
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="steuer" class="karte">
  <div id="steuerkopf"><b>Van-Spur</b><span class="pfeil">▾</span></div>
  <div id="steuerkoerper">
    <div class="feld">
      <label>Zeitraum</label>
      <div class="zeile"><input type="date" id="von"><input type="date" id="bis"></div>
    </div>
    <div class="feld">
      <button class="knopf" id="los">Anzeigen</button>
    </div>
    <div class="feld">
      <label>Dauer der Abspielung <span class="wert" id="tempowert">18 s</span></label>
      <input type="range" id="tempo" min="1" max="8" value="3">
    </div>
    <div class="feld">
      <button class="knopf still an" id="tRoute">Strecke</button>
      <button class="knopf still" id="tPunkte">Messpunkte</button>
      <button class="knopf still" id="tKreise">Genauigkeit</button>
    </div>
    <div class="feld">
      <button class="knopf" id="fahren">Fahrt abspielen</button>
      <button class="knopf still" id="teilen">Link kopieren</button>
    </div>
  </div>
</div>

<div id="zahlen" class="karte"></div>
<div id="hinweis" class="karte" hidden>Die Strecke ist noch verdeckt. <b>Fahrt abspielen</b>
  zeigt sie Stück für Stück, <b>Strecke</b> blendet sie sofort ein.</div>

<div id="liste" class="karte">
  <div id="listekopf">Aufenthalte</div>
  <div id="listekoerper"></div>
</div>

<div id="fahrt" class="karte">
  <div><div class="klein">Zeit</div><div class="gross" id="fZeit">–</div></div>
  <div><div class="klein">Strecke</div><div class="gross" id="fKm">–</div></div>
  <div><div class="klein">Als Nächstes</div><div class="gross" id="fNext">–</div></div>
  <button class="knopf still" id="fStop" style="width:auto;padding:7px 14px">Stopp</button>
</div>

<div id="lade">
  <div id="ladetext">Daten werden geladen</div>
  <div class="balken"><i id="ladebalken"></i></div>
</div>

<div id="tor">
  <div style="font-weight:600">Reisespur</div>
  <input type="password" id="pw" placeholder="Passwort" autocomplete="current-password">
  <button class="knopf" id="rein">Öffnen</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
<script src="analyse.js"></script>
<script>
(() => {
  'use strict';

  // Die veroeffentlichte CSV-Adresse. Die frueher benutzte Export-Adresse
  // scheiterte im Browser still an CORS, worauf die alte Seite unbemerkt
  // eingebaute Beispieldaten vom Februar 2025 anzeigte.
  const STANDARD_SHEET =
    'https://docs.google.com/spreadsheets/d/' +
    '13nN8lisfKRQHbD66J2pg1k5jN9lFz15ijwx0obu-03o' +
    '/pub?gid=0&single=true&output=csv';
  // Zum Testen laesst sich eine oertliche Datei angeben. Fremde Adressen werden
  // nicht geladen, sonst koennte ein praeparierter Link fremde Daten einspielen.
  const wunsch = (new URLSearchParams(location.search)).get('csv');
  const SHEET = (wunsch && /^[\w./-]+$/.test(wunsch) && !wunsch.startsWith('//'))
    ? wunsch : STANDARD_SHEET;

  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const FARBE = {}, NAME = {
    pause:'Pause', halt:'Halt', 'langer-halt':'Längerer Halt',
    uebernachtung:'Übernachtung', standtage:'Standtage'
  };
  // Spieldauer der ganzen Reise in Sekunden. Echtzeit waere sinnlos: bei einem
  // zweitaegigen Aufenthalt saesse man zwei Tage davor.
  const DAUERN = [8,12,18,25,35,50,70,100];

  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);

  let karte, erg = null, csv = null;
  let laeuft = false, raf = null, letzteGrenzen = null;
  const gruppe = { strecke:null, punkte:null, kreise:null, stops:null, van:null };
  const zeigt = { strecke:false, punkte:false, kreise:false };

  // Symbole als Inline-SVG statt Emoji. Emoji sehen auf jedem Betriebssystem
  // anders aus und lassen sich nicht einfaerben.
  const GLYPH = {
    pause: '<path d="M5 9h10v4.5A4.5 4.5 0 0 1 10.5 18A5.5 5.5 0 0 1 5 12.5V9z"/>' +
           '<path d="M15 10.5h1.8a2.2 2.2 0 0 1 0 4.4H15"/>' +
           '<path d="M8 6.6V5"/><path d="M11.6 6.6V5"/>',
    halt: '<text x="12" y="17.5" text-anchor="middle" font-size="15.5" font-weight="700" ' +
          'fill="#fff" stroke="none" font-family="-apple-system,Segoe UI,Roboto,sans-serif">P</text>',
    'langer-halt': '<circle cx="12" cy="12" r="7.5"/><path d="M12 7.2V12l3.2 2"/>',
    uebernachtung: '<path d="M17.6 13.9A7.2 7.2 0 0 1 9.6 5.9a7.2 7.2 0 1 0 8 8z"/>',
    // Zelt mit Eingang statt blossem Dreieck, das sonst wie ein Warnschild wirkt
    standtage: '<path d="M12 4.6 3.8 19.4h16.4L12 4.6z"/>' +
               '<path d="M12 11.8 9.1 19.4"/><path d="M12 11.8l2.9 7.6"/>'
  };

  function haltSymbol(art, klasse){
    const g = { pause:26, halt:30, 'langer-halt':31, uebernachtung:34, standtage:38 }[art] || 28;
    return L.divIcon({
      className: '',
      html: `<div class="poi${klasse ? ' ' + klasse : ''}" style="--c:${FARBE[art]};width:${g}px;height:${g}px">` +
            `<svg viewBox="0 0 24 24">${GLYPH[art] || ''}</svg></div>`,
      iconSize: [g, g], iconAnchor: [g/2, g/2]
    });
  }

  /* ---------- Hilfsformate ---------- */
  const nk1 = n => n.toFixed(1).replace('.', ',');
  const fmtDauer = s => s >= 86400 ? nk1(s/86400)+' Tage'
                      : s >= 3600  ? nk1(s/3600)+' h'
                      : Math.round(s/60)+' min';
  const tausend = n => Math.round(n).toLocaleString('de-DE');
  const fmtZeit = d => d.toLocaleString('de-DE',
    {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const fmtUhr = d => d.toLocaleString('de-DE',
    {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

  /* ---------- Passwort: ein Vorhang, kein Schloss ---------- */
  function tor(){
    const auf = () => {
      if ($('pw').value !== 'thorsten'){ $('pw').value=''; $('pw').focus(); return; }
      try { sessionStorage.setItem('trk','1'); } catch(e){}
      $('tor').remove(); start();
    };
    let frei = false;
    try { frei = sessionStorage.getItem('trk') === '1'; } catch(e){}
    if (frei){ $('tor').remove(); start(); return; }
    $('rein').onclick = auf;
    $('pw').onkeydown = e => { if (e.key === 'Enter') auf(); };
    $('pw').focus();
  }

  /* ---------- Karte ---------- */
  function initKarte(){
    karte = L.map('map',{zoomControl:false,attributionControl:true}).setView([46,18],5);
    L.control.zoom({position:'topright'}).addTo(karte);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(karte);
    for (const k of Object.keys(gruppe)) gruppe[k] = L.layerGroup().addTo(karte);
    for (const k of ['pause','halt','langer-halt','uebernachtung','standtage'])
      FARBE[k] = css('--'+(k==='langer-halt'?'halt':k==='uebernachtung'?'nacht':k==='standtage'?'tage':k));
    // Zum Nachsehen in der Konsole des Browsers
    window.vanspur = { karte, get erg(){ return erg; } };
  }

  function leere(){
    for (const k of Object.keys(gruppe)) gruppe[k].clearLayers();
  }

  function zeichne(){
    leere();
    const grenzen = [];

    for (const s of erg.segs){
      if (!s || s.art === 'steht') continue;
      if (s.geo?.length){
        L.polyline(s.geo,{color:css('--fahrt'),weight:3.5,opacity:.85,lineJoin:'round'})
          .addTo(gruppe.strecke);
        for (const c of s.geo) grenzen.push(c);
      } else {
        // Keine Route berechenbar: als Vermutung kennzeichnen, nicht als Fahrt
        L.polyline([[s.a.lat,s.a.lon],[s.b.lat,s.b.lon]],
          {color:css('--dim'),weight:2,dashArray:'5,8',opacity:.75}).addTo(gruppe.strecke);
        grenzen.push([s.a.lat,s.a.lon],[s.b.lat,s.b.lon]);
      }
    }

    for (const p of erg.punkte){
      L.circleMarker([p.lat,p.lon],{radius:3,color:css('--dim'),weight:1,
        fillColor:css('--dim'),fillOpacity:.55})
        .bindTooltip(`Messung ${fmtZeit(p.time)}` +
          (p.zelle ? `<br>Zelle ${p.zelle}` : '') +
          (isFinite(p.rsrp) ? `<br>Empfang ${p.rsrp} dBm` : '') +
          (isFinite(p.genauigkeit) ? `<br>Genauigkeit ±${Math.round(p.genauigkeit)} m` : ''))
        .addTo(gruppe.punkte);
      if (isFinite(p.genauigkeit) && p.genauigkeit > 0)
        L.circle([p.lat,p.lon],{radius:p.genauigkeit,color:css('--fahrt'),weight:1,
          opacity:.35,fillOpacity:.06}).addTo(gruppe.kreise);
      grenzen.push([p.lat,p.lon]);
    }

    erg.stops.forEach(h => {
      h._marker = L.marker([h.lat,h.lon], {icon:haltSymbol(h.art), zIndexOffset:400})
        .bindPopup(
          `<b>${NAME[h.art]}</b><br>${fmtZeit(h.von)} bis ${fmtZeit(h.bis)}<br>Dauer ${fmtDauer(h.sek)}` +
          (h.aufRoute ? `<br><span style="color:#888">auf der Strecke geschätzt, ${Math.round(h.versatz)} m vom Mast</span>` : '') +
          (h.unsicher ? `<br><span style="color:#888">langer Aufenthalt, Position nur auf Funkzelle genau</span>` : ''))
        .addTo(gruppe.stops);
      grenzen.push([h.lat,h.lon]);
    });

    sichtbarkeit();
    letzteGrenzen = grenzen.length ? grenzen : null;
    if (!letzteGrenzen) return;
    if (zeigt.strecke){
      karte.fitBounds(letzteGrenzen, kartenRand());
    } else {
      // Verdeckter Start: die Karte zeigt nur, wo es losgeht. Wer die ganze
      // Reise gleich sehen will, blendet die Strecke ein.
      const a = erg.punkte[0];
      L.circleMarker([a.lat,a.lon], {radius:9, color:'#fff', weight:3,
          fillColor:css('--akzent'), fillOpacity:.95})
        .bindTooltip('Start der Reise · ' + fmtZeit(a.time), {permanent:false})
        .addTo(gruppe.van);
      karte.fitBounds([[a.lat-.35, a.lon-.35],[a.lat+.35, a.lon+.35]], kartenRand());
    }
  }

  // Links liegt das Bedienfeld, rechts die Liste. Ohne diesen Versatz
  // verschwindet die Spur halb darunter.
  function kartenRand(){
    const schmal = window.innerWidth < 820;
    return { paddingTopLeft:     schmal ? [30,90]  : [330,80],
             paddingBottomRight: schmal ? [30,120] : [350,60] };
  }

  function sichtbarkeit(){
    const setze = (g,an) => an ? karte.addLayer(g) : karte.removeLayer(g);
    setze(gruppe.strecke, zeigt.strecke);
    setze(gruppe.stops,   zeigt.strecke);   // Aufenthalte gehoeren zur Strecke
    setze(gruppe.punkte,  zeigt.punkte);
    setze(gruppe.kreise,  zeigt.kreise);
    $('hinweis').hidden = zeigt.strecke;
    if (zeigt.strecke && !laeuft) gruppe.van.clearLayers();
    $('tRoute').classList.toggle('an', zeigt.strecke);
    $('tPunkte').classList.toggle('an', zeigt.punkte);
    $('tKreise').classList.toggle('an', zeigt.kreise);
  }

  // Kleine Ausgabe desselben Symbols fuer Legende und Liste
  const mini = art =>
    `<i class="poi mini" style="--c:${FARBE[art]}"><svg viewBox="0 0 24 24">${GLYPH[art]||''}</svg></i>`;

  /* ---------- Liste ---------- */
  function liste(){
    const k = $('listekoerper');
    if (!erg.stops.length){
      k.innerHTML = '<div class="legende">Keine Aufenthalte im gewählten Zeitraum.</div>';
      return;
    }
    k.innerHTML =
      '<div class="legende">' + Object.keys(NAME).map(x =>
        `<span>${mini(x)}${NAME[x]}</span>`).join('') + '</div>' +
      erg.stops.map((h,i) =>
        `<div class="halt" data-i="${i}">` +
        mini(h.art) +
        `<span class="zeit">${fmtZeit(h.von)}</span>` +
        `<span class="was">${NAME[h.art]}</span>` +
        `<span class="dauer">${fmtDauer(h.sek)}</span></div>`).join('');
    k.querySelectorAll('.halt').forEach(row => {
      row.onclick = () => {
        const h = erg.stops[+row.dataset.i];
        if (!zeigt.strecke){ zeigt.strecke = true; sichtbarkeit(); }   // Ausschnitt setzt der Sprung unten
        k.querySelectorAll('.halt').forEach(r => r.classList.remove('aktiv'));
        row.classList.add('aktiv');
        karte.setView([h.lat,h.lon], 12);
        h._marker?.openPopup();
      };
    });
  }

  /* ---------- Fahrt abspielen ----------
     Nicht in Echtzeit. Die ganze Reise laeuft in wenigen Sekunden ab, sonst
     wartet man bei einem zweitaegigen Aufenthalt zwei Tage. Vorgerueckt wird
     nach zurueckgelegter Strecke, nicht nach Uhrzeit. An jedem Aufenthalt
     haelt der Van kurz an, damit man ihn wahrnimmt.

     Die Strecke waechst hinter dem Van, statt vorher schon dazuliegen. */

  // Gewicht der Haltepause je Art. Die tatsaechliche Laenge ergibt sich aus
  // dem Budget, damit die eingestellte Gesamtdauer auch stimmt.
  const PAUSE_GEWICHT = { pause:1, halt:1.6, 'langer-halt':2.2, uebernachtung:2.8, standtage:3.4 };

  // Stuetzpunkte aller Fahrtabschnitte, mit laufender Strecke und Uhrzeit.
  function bahnBauen(){
    const pfad = [];
    let km = 0;
    for (const s of erg.segs){
      if (!s || s.art === 'steht') continue;
      const geo = s.geo?.length ? s.geo : [[s.a.lat,s.a.lon],[s.b.lat,s.b.lon]];
      const spanne = s.b.time - s.a.bis;
      for (let i = 0; i < geo.length; i++){
        if (i > 0) km += Analyse.meter({lat:geo[i-1][0],lon:geo[i-1][1]},
                                       {lat:geo[i][0],lon:geo[i][1]}) / 1000;
        pfad.push({ lat:geo[i][0], lon:geo[i][1], km,
                    zeit:new Date(+s.a.bis + spanne * i / (geo.length-1 || 1)) });
      }
    }
    // Jeden Aufenthalt an den naechstgelegenen Stuetzpunkt haengen
    const marken = [];
    for (const h of erg.stops){
      let bi = -1, bd = Infinity;
      for (let i = 0; i < pfad.length; i++){
        const d = Analyse.meter(h, pfad[i]);
        if (d < bd){ bd = d; bi = i; }
      }
      if (bi >= 0 && bd < 25000) marken.push({ halt:h, i:bi });
    }
    marken.sort((a,b) => a.i - b.i);
    return { pfad, marken };
  }

  function fahrtStart(){
    fahrtStop(true);
    const { pfad, marken } = bahnBauen();
    if (pfad.length < 2){ return; }

    // Nichts vorwegnehmen: Strecke und Aufenthalte verschwinden, bis der Van
    // sie erreicht.
    karte.removeLayer(gruppe.strecke);
    karte.removeLayer(gruppe.stops);

    const spur = L.polyline([[pfad[0].lat,pfad[0].lon]],
      {color:css('--fahrt'), weight:4, opacity:.9, lineJoin:'round'}).addTo(gruppe.van);
    const van = L.marker([pfad[0].lat,pfad[0].lon], {
      icon: L.divIcon({html:'<div class="van-icon">🚐</div>', className:'', iconSize:[34,34], iconAnchor:[17,17]}),
      zIndexOffset: 1000
    }).addTo(gruppe.van);

    $('fahrt').classList.add('an');
    $('fahren').textContent = 'Läuft …';
    $('fahren').disabled = true;
    // Kein Hineinzoomen zum Start: der Ausschnitt bleibt der Ueberblick, in dem
    // die Spur waechst. Das zeigt die Reise als Ganzes und haengt nicht an
    // Leaflets Zoom-Animation.

    const gesamtKm = pfad[pfad.length-1].km || 1;
    const gesamtMs = DAUERN[+$('tempo').value - 1] * 1000;
    // Rund ein Drittel der Spielzeit gehoert den Aufenthalten, der Rest der
    // Fahrt. Sonst haengt die Gesamtdauer an der Zahl der Stopps.
    const gewichtSumme = marken.reduce((a,m) => a + (PAUSE_GEWICHT[m.halt.art] || 1), 0) || 1;
    const pausenBudget = gesamtMs * 0.34;
    const pauseFuer = h => Math.max(90, Math.min(
      pausenBudget * (PAUSE_GEWICHT[h.art] || 1) / gewichtSumme, 900));
    const dauerMs = gesamtMs - Math.min(pausenBudget, marken.reduce((a,m)=>a+pauseFuer(m.halt),0));
    let i = 0, naechsteMarke = 0, wartetBis = 0, t0 = 0, gefahrenKm = 0;

    const schritt = (jetzt) => {
      if (!laeuft) return;
      if (!t0) t0 = jetzt;

      if (jetzt >= wartetBis){
        const anteil = Math.min((jetzt - t0 - warteSumme) / dauerMs, 1);
        gefahrenKm = anteil * gesamtKm;

        while (i < pfad.length - 1 && pfad[i+1].km <= gefahrenKm) i++;

        // Zwischen zwei Stuetzpunkten interpolieren, sonst ruckelt es sichtbar
        const a = pfad[i], b = pfad[Math.min(i+1, pfad.length-1)];
        const spanne = (b.km - a.km) || 1;
        const f = Math.max(0, Math.min((gefahrenKm - a.km) / spanne, 1));
        const pos = [a.lat + (b.lat-a.lat)*f, a.lon + (b.lon-a.lon)*f];
        van.setLatLng(pos);
        spur.addLatLng(pos);

        // Aufenthalt erreicht: Symbol einblenden und kurz innehalten
        while (naechsteMarke < marken.length && marken[naechsteMarke].i <= i){
          const m = marken[naechsteMarke++];
          zeigeHalt(m.halt);
          const warte = pauseFuer(m.halt);
          wartetBis = jetzt + warte;
          warteSumme += warte;
          $('fNext').textContent = NAME[m.halt.art];
        }

        $('fZeit').textContent = fmtUhr(a.zeit);
        $('fKm').textContent = tausend(gefahrenKm) + ' km';

        folge(pos);
        if (anteil >= 1){ fahrtEnde(); return; }
      }
      raf = requestAnimationFrame(schritt);
    };

    let warteSumme = 0;
    laeuft = true;
    raf = requestAnimationFrame(schritt);
  }

  // Der Karte nur folgen, wenn der Van den mittleren Bereich verlaesst. Ein
  // panTo bei jedem Bild kaempft gegen die eigene Animation und wirkt hakelig.
  function folge(pos){
    const g = karte.getBounds(), nw = karte.latLngToContainerPoint(g.getNorthWest()),
          se = karte.latLngToContainerPoint(g.getSouthEast());
    const p = karte.latLngToContainerPoint(pos);
    const bx = (se.x - nw.x) * 0.26, by = (se.y - nw.y) * 0.26;
    if (p.x < nw.x + bx || p.x > se.x - bx || p.y < nw.y + by || p.y > se.y - by)
      karte.panTo(pos, {animate:false});
  }

  function zeigeHalt(h){
    L.marker([h.lat,h.lon], {icon:haltSymbol(h.art, 'neu'), zIndexOffset:400})
      .bindTooltip(`${NAME[h.art]} · ${fmtDauer(h.sek)}`)
      .addTo(gruppe.van);
  }

  function fahrtEnde(){
    laeuft = false;
    if (raf) cancelAnimationFrame(raf), raf = null;
    $('fahrt').classList.remove('an');
    $('fahren').textContent = 'Fahrt abspielen';
    $('fahren').disabled = false;
    // Danach wieder der vollstaendige Ueberblick
    gruppe.van.clearLayers();
    zeigt.strecke = true;          // nach der Fahrt ist nichts mehr zu verraten
    sichtbarkeit();
    if (letzteGrenzen) karte.fitBounds(letzteGrenzen, kartenRand());
  }

  function fahrtStop(still){
    laeuft = false;
    if (raf) cancelAnimationFrame(raf), raf = null;
    gruppe.van.clearLayers();
    $('fahrt').classList.remove('an');
    $('fahren').textContent = 'Fahrt abspielen';
    $('fahren').disabled = false;
    if (!still){ sichtbarkeit(); }
  }

  /* ---------- Ablauf ---------- */
  async function auswerten(){
    fahrtStop();
    const von = $('von').value ? new Date($('von').value+'T00:00:00Z') : null;
    const bis = $('bis').value ? new Date($('bis').value+'T23:59:59Z') : null;

    zeigt.strecke = false;          // neuer Zeitraum, wieder verdeckt
    $('lade').style.display = 'flex';
    $('ladebalken').style.width = '0%';
    $('ladetext').textContent = 'Strecke wird berechnet';
    $('los').disabled = true;

    try {
      erg = await Analyse.lauf(csv, von, bis, (i,n) => {
        $('ladebalken').style.width = (i/n*100)+'%';
        $('ladetext').textContent = `Strecke wird berechnet (${i} von ${n})`;
      });
    } catch(e){
      $('ladetext').innerHTML = '<div class="fehler">Auswertung fehlgeschlagen: '+e.message+'</div>';
      $('los').disabled = false;
      return;
    }

    const z = erg.zahlen;
    $('zahlen').innerHTML =
      `<span><b>${z.imZeitraum}</b> Messungen</span>` +
      `<span><b>${tausend(z.km)}</b> km über Straßen</span>` +
      `<span><b>${erg.stops.length}</b> Aufenthalte</span>` +
      `<span><b>${z.faehrt + z.faehrtHalt}</b> Fahrtabschnitte</span>` +
      (z.pingpongEntfernt ? `<span><b>${z.pingpongEntfernt}</b> Mastwechsel ohne Bewegung entfernt</span>` : '') +
      (z.unklar ? `<span><b>${z.unklar}</b> ohne Route</span>` : '');

    zeichne();
    liste();
    $('lade').style.display = 'none';
    $('los').disabled = false;
    $('fahren').disabled = erg.segs.length < 2;
  }

  /* Beim Aufruf ohne Zeitraum soll etwas Sehenswertes erscheinen. Die letzten
     30 Tage taugen dafuer nicht: steht der Van zuhause, wechselt die Funkzelle
     kaum und es bleiben zwei Messpunkte. Stattdessen wird so weit zurueck
     gegangen, bis genug Bewegung im Fenster liegt. */
  function vorgabeZeitraum(punkte){
    const letzte = +punkte[punkte.length-1].time;
    const GENUG = 20, MAX_TAGE = 400;
    for (const tage of [30, 60, 120, 200, 300, MAX_TAGE]){
      const von = letzte - tage*864e5;
      const drin = punkte.filter(p => +p.time >= von);
      if (drin.length >= GENUG){
        // Auf die tatsaechlich belegte Spanne zuschneiden, damit die Karte
        // nicht auf leere Wochen zoomt.
        return [+drin[0].time, letzte];
      }
    }
    return [+punkte[0].time, letzte];
  }

  async function start(){
    // Auf schmalen Bildschirmen verdeckt das Bedienfeld sonst die halbe Karte
    if (window.innerWidth < 820) $('steuer').classList.add('zu');
    initKarte();
    try {
      const r = await fetch(SHEET);
      if (!r.ok) throw new Error('HTTP '+r.status);
      csv = await r.text();
      if (!csv || csv.length < 40) throw new Error('leere Antwort');
    } catch(e){
      $('ladetext').innerHTML =
        '<div class="fehler">Die Daten konnten nicht geladen werden (' + e.message + ').<br>' +
        'Das Tabellenblatt muss im Web veröffentlicht sein.</div>';
      return;
    }

    const punkte = Analyse.parse(csv);
    if (!punkte.length){
      $('ladetext').innerHTML = '<div class="fehler">Keine brauchbaren Zeilen in den Daten.</div>';
      return;
    }
    const iso = d => new Date(d).toISOString().slice(0,10);
    const [vorgabeVon, vorgabeBis] = vorgabeZeitraum(punkte);
    $('von').value = params.get('start') || iso(vorgabeVon);
    $('bis').value = params.get('end')   || iso(vorgabeBis);

    $('los').onclick = auswerten;
    $('fahren').onclick = fahrtStart;
    $('fStop').onclick = fahrtStop;
    $('tempo').oninput = () => $('tempowert').textContent = DAUERN[+$('tempo').value-1] + ' s';
    $('tempo').oninput();
    $('tRoute').onclick  = () => {
      zeigt.strecke = !zeigt.strecke;
      sichtbarkeit();
      // Beim Aufdecken den Blick auf die ganze Reise weiten, sonst bleibt die
      // Karte am Startpunkt stehen und man sieht nur ein Stueck.
      if (zeigt.strecke && !laeuft && letzteGrenzen) karte.fitBounds(letzteGrenzen, kartenRand());
    };
    $('tPunkte').onclick = () => { zeigt.punkte  = !zeigt.punkte;  sichtbarkeit(); };
    $('tKreise').onclick = () => { zeigt.kreise  = !zeigt.kreise;  sichtbarkeit(); };
    $('steuerkopf').onclick = () => $('steuer').classList.toggle('zu');
    $('teilen').onclick = async () => {
      const u = new URL(location.href);
      u.search = `?start=${$('von').value}&end=${$('bis').value}`;
      try { await navigator.clipboard.writeText(u.toString()); $('teilen').textContent='kopiert'; }
      catch(e){ prompt('Link', u.toString()); }
      setTimeout(() => $('teilen').textContent = 'Link kopieren', 1600);
    };

    auswerten();
  }

  tor();
})();
</script>
</body>
