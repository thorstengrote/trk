<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Van Travel Tracking</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            background: #000;
        }
        
        // URL Parameter handling
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const startDate = urlParams.get('start');
            const endDate = urlParams.get('end');

            if (startDate) document.getElementById('startDate').value = startDate;
            if (endDate) document.getElementById('endDate').value = endDate;
            
            // POI Parameter aus URL laden
            if (urlParams.get('maxClusterDistance')) {
                maxClusterDistance = parseInt(urlParams.get('maxClusterDistance'));
                document.getElementById('maxClusterDistance').value = maxClusterDistance;
            }
            if (urlParams.get('minTimeBetweenPOIs')) {
                minTimeBetweenPOIs = parseInt(urlParams.get('minTimeBetweenPOIs')) * 60 * 1000;
                document.getElementById('minTimeBetweenPOIs').value = parseInt(urlParams.get('minTimeBetweenPOIs'));
            }
            if (urlParams.get('sleepingThreshold')) {
                sleepingThreshold = parseInt(urlParams.get('sleepingThreshold'));
                document.getElementById('sleepingThreshold').value = sleepingThreshold;
            }
            if (urlParams.get('parkingThreshold')) {
                parkingThreshold = parseInt(urlParams.get('parkingThreshold'));
                document.getElementById('parkingThreshold').value = parkingThreshold;
            }
            if (urlParams.get('coffeeBreakThreshold')) {
                coffeeBreakThreshold = parseInt(urlParams.get('coffeeBreakThreshold'));
                document.getElementById('coffeeBreakThreshold').value = coffeeBreakThreshold;
            }
            if (urlParams.get('maxMergeDistance')) {
                maxMergeDistance = parseInt(urlParams.get('maxMergeDistance'));
                document.getElementById('maxMergeDistance').value = maxMergeDistance;
            }
            if (urlParams.get('maxTimeBetweenMerge')) {
                maxTimeBetweenMerge = parseInt(urlParams.get('maxTimeBetweenMerge')) * 60 * 60 * 1000;
                document.getElementById('maxTimeBetweenMerge').value = parseInt(urlParams.get('maxTimeBetweenMerge'));
            }
            if (urlParams.get('roadSnapDistance')) {
                roadSnapDistance = parseInt(urlParams.get('roadSnapDistance'));
                document.getElementById('roadSnapDistance').value = roadSnapDistance;
            }
        });
        #map {
            height: 100vh;
            width: 100%;
        }
        #controls-overlay {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 1000;
        }
        #controls-button {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(20px);
            transition: all 0.2s ease;
            border: 0.5px solid rgba(0, 0, 0, 0.04);
        }
        #controls-button:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.05);
        }
        #controls-button i {
            font-size: 18px;
            color: #1d1d1f;
        }
        #controls-content {
            position: absolute;
            bottom: 54px;
            left: 0;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 20px;
            min-width: 280px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            backdrop-filter: blur(20px);
            border: 0.5px solid rgba(0, 0, 0, 0.04);
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }
        #controls-content.expanded {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        #info-overlay {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 16px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            z-index: 1000;
            display: none;
            backdrop-filter: blur(20px);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        #info-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #info-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        #elevation-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }
        #elevation-chart {
            width: 80px;
            height: 60px;
            background: rgba(200, 200, 200, 0.3);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.1);
        }
        #elevation-value {
            font-size: 9px;
            margin-top: 2px;
            text-align: center;
        }
        .control-group {
            margin-bottom: 16px;
        }
        .control-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #1d1d1f;
            margin-bottom: 8px;
        }
        .control-group input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e5e5e7;
            outline: none;
            -webkit-appearance: none;
        }
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #007aff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 122, 255, 0.3);
        }
        .control-group input[type="number"], 
        .control-group input[type="date"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 14px;
            background: #f2f2f7;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        }
        .control-group input[type="number"]:focus,
        .control-group input[type="date"]:focus {
            outline: none;
            border-color: #007aff;
            background: white;
        }
        #parameter-panel {
            position: absolute;
            bottom: 30px;
            left: 84px;
            z-index: 1000;
        }
        #parameter-button {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(20px);
            transition: all 0.2s ease;
            border: 0.5px solid rgba(0, 0, 0, 0.04);
        }
        #parameter-button:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.05);
        }
        #parameter-button i {
            font-size: 18px;
            color: #1d1d1f;
        }
        #parameter-content {
            position: absolute;
            bottom: 54px;
            left: 0;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 20px;
            min-width: 300px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            backdrop-filter: blur(20px);
            border: 0.5px solid rgba(0, 0, 0, 0.04);
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }
        #parameter-content.expanded {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.15s ease;
        }
        button:hover {
            background: #0056d3;
        }
        #loadingModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        #loadingContent {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #passwordOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        #passwordContent {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            min-width: 300px;
        }
        #passwordInput {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="passwordOverlay">
        <div id="passwordContent">
            <h2>Enter Password</h2>
            <input type="password" id="passwordInput" placeholder="Password">
            <button onclick="checkPassword()">Submit</button>
        </div>
    </div>

    <div id="loadingModal">
        <div id="loadingContent">
            <div class="spinner"></div>
            <h3>Calculating Route</h3>
        </div>
    </div>

    <div id="map"></div>

    <div id="info-overlay">
        <div id="info-content">
            <div id="info-text">
                <div>📅 <span id="current-date">--</span></div>
                <div>🕐 <span id="current-time">--</span></div>
                <div>📏 <span id="total-distance">--</span> km</div>
            </div>
            <div id="elevation-display">
                <div id="elevation-chart"></div>
                <div id="elevation-value"><span id="current-elevation">--</span>m</div>
            </div>
        </div>
    </div>

    <div id="controls-overlay">
        <div id="controls-button" onclick="toggleControls()">
            <i class="fas fa-cog"></i>
        </div>
        <div id="controls-content">
            <div class="control-group">
                <label for="speedRange">Animation Speed</label>
                <input type="range" id="speedRange" min="1" max="100" value="20" oninput="updateSpeed(this.value)">
                <span id="speedValue">20</span>x speed
            </div>
            <div class="control-group">
                <button onclick="togglePoints()">Show Points</button>
                <button onclick="toggleAnimation()">Start Animation</button>
                <button onclick="toggleRoute()">Show Route</button>
                <button onclick="toggleDriveRoute()">Drive Route</button>
            </div>
            <div class="control-group">
                <label for="startDate">Start Date</label>
                <input type="date" id="startDate" onchange="updateDateRange()">
            </div>
            <div class="control-group">
                <label for="endDate">End Date</label>
                <input type="date" id="endDate" onchange="updateDateRange()">
            </div>
            <div class="control-group">
                <button onclick="generateShareLink()">Generate Share Link</button>
                <div id="shareLink"></div>
            </div>
        </div>
    </div>

    <div id="parameter-panel">
        <div id="parameter-button" onclick="toggleParameters()">
            <i class="fas fa-sliders-h"></i>
        </div>
        <div id="parameter-content">
            <div class="control-group">
                <label for="maxClusterDistance">Max Cluster Distance (m)</label>
                <input type="number" id="maxClusterDistance" value="1000">
            </div>
            <div class="control-group">
                <label for="minTimeBetweenPOIs">Min Time Between POIs (min)</label>
                <input type="number" id="minTimeBetweenPOIs" value="15">
            </div>
            <div class="control-group">
                <label for="sleepingThreshold">Sleeping Threshold (min)</label>
                <input type="number" id="sleepingThreshold" value="360">
            </div>
            <div class="control-group">
                <label for="parkingThreshold">Parking Threshold (min)</label>
                <input type="number" id="parkingThreshold" value="60">
            </div>
            <div class="control-group">
                <label for="coffeeBreakThreshold">Coffee Break Threshold (min)</label>
                <input type="number" id="coffeeBreakThreshold" value="20">
            </div>
            <div class="control-group">
                <label for="maxMergeDistance">Max Merge Distance (m)</label>
                <input type="number" id="maxMergeDistance" value="2000">
            </div>
            <div class="control-group">
                <label for="maxTimeBetweenMerge">Max Time Between Merge (hours)</label>
                <input type="number" id="maxTimeBetweenMerge" value="24">
            </div>
            <div class="control-group">
                <label for="roadSnapDistance">Road Snap Distance (m)</label>
                <input type="number" id="roadSnapDistance" value="5000">
            </div>
            <button onclick="updateParameters()">Apply Changes</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Globale Variablen
        var map;
        var coordinates = [];
        var filteredCoordinates = [];
        var poiCoordinates = [];
        var vanMarker = null;
        var currentMarker = null;
        var routePath = null;
        var animationRunning = false;
        var driveRouteRunning = false;
        var speed = 20;
        var animationTimeout = null;
        var totalDistance = 0;
        var lastPosition = null;
        var stopMarkers = [];
        var currentAnimationIndex = 0;
        var elevationData = [];
        var currentElevation = 0;

        // POI Parameter  
        var maxClusterDistance = 1000;
        var minTimeBetweenPOIs = 15 * 60 * 1000;
        var sleepingThreshold = 360;
        var parkingThreshold = 60;
        var coffeeBreakThreshold = 20;
        var maxMergeDistance = 2000;
        var maxTimeBetweenMerge = 24 * 60 * 60 * 1000;
        var roadSnapDistance = 5000;

        // Password Check (mit debugging)
        function checkPassword() {
            var password = document.getElementById('passwordInput').value;
            console.log('Password entered:', password);
            
            if (password === 'thorsten') {
                console.log('Password correct, hiding overlay...');
                document.getElementById('passwordOverlay').style.display = 'none';
                
                console.log('Starting map initialization...');
                setTimeout(function() {
                    initializeMap();
                }, 100);
            } else {
                alert('Incorrect password');
            }
        }

        // Map initialisieren (mit expliziter Größe und besserer Fehlerbehandlung)
        function initializeMap() {
            try {
                // Prüfen ob Leaflet geladen ist
                if (typeof L === 'undefined') {
                    console.error('Leaflet library not loaded!');
                    alert('Map library not loaded. Please refresh the page.');
                    return;
                }
                
                console.log('Leaflet version:', L.version);
                
                // Map Container prüfen
                const mapContainer = document.getElementById('map');
                if (!mapContainer) {
                    console.error('Map container not found!');
                    return;
                }
                
                console.log('Map container found:', mapContainer);
                console.log('Container dimensions:', mapContainer.offsetWidth, 'x', mapContainer.offsetHeight);
                
                // Bestehende Map entfernen falls vorhanden
                if (map) {
                    map.remove();
                    map = null;
                }
                
                console.log('Initializing map...');
                
                // Map erstellen
                map = L.map('map', {
                    preferCanvas: false,
                    attributionControl: true,
                    zoomControl: true
                }).setView([50.7852, 7.0141], 10); // Bornheim als Center
                
                console.log('Map object created:', map);
                
                // Tile Layer hinzufügen
                const tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 19,
                    detectRetina: true
                });
                
                tileLayer.addTo(map);
                
                tileLayer.on('loading', function() {
                    console.log('Tiles loading...');
                });
                
                tileLayer.on('load', function() {
                    console.log('Tiles loaded successfully!');
                });
                
                tileLayer.on('tileerror', function(error) {
                    console.error('Tile loading error:', error);
                });
                
                // Map Event Listeners
                map.on('moveend', function() {
                    console.log('Map moved to:', map.getCenter());
                });
                
                // Force resize nach kurzer Verzögerung
                setTimeout(function() {
                    if (map) {
                        map.invalidateSize();
                        console.log('Map size invalidated');
                        console.log('Final map container size:', map.getContainer().offsetWidth, 'x', map.getContainer().offsetHeight);
                    }
                }, 200);
                
                console.log('Map initialization complete');
                
                // GPS Daten laden
                loadGPSData();
                
            } catch (error) {
                console.error('Map initialization failed:', error);
                alert('Map initialization failed: ' + error.message + '. Please refresh the page.');
            }
        }

        // Controls toggle
        function toggleControls() {
            var content = document.getElementById('controls-content');
            content.classList.toggle('expanded');
        }

        // Parameter panel toggle
        function toggleParameters() {
            var content = document.getElementById('parameter-content');
            content.classList.toggle('expanded');
        }

        // Speed update
        function updateSpeed(value) {
            speed = parseInt(value);
            document.getElementById('speedValue').textContent = value;
        }

        // Drive Route toggle
        function toggleDriveRoute() {
            if (!driveRouteRunning) {
                startDriveRoute();
            } else {
                stopDriveRoute();
            }
        }

        // Drive Route starten
        function startDriveRoute() {
            document.getElementById('loadingModal').style.display = 'flex';
            document.getElementById('info-overlay').style.display = 'block';
            
            // Route vorbereiten
            if (routePath) map.removeLayer(routePath);
            routePath = L.polyline([], {color: 'blue'}).addTo(map);
            
            if (vanMarker) {
                map.removeLayer(vanMarker);
                vanMarker = null;
            }
            
            driveRouteRunning = true;
            totalDistance = 0;
            lastPosition = null;
            
            document.querySelector('button[onclick="toggleDriveRoute()"]').textContent = "Stop Driving";
            calculateCompleteRoute();
        }

        // Drive Route stoppen
        function stopDriveRoute() {
            driveRouteRunning = false;
            if (animationTimeout) clearTimeout(animationTimeout);
            if (vanMarker) {
                map.removeLayer(vanMarker);
                vanMarker = null;
            }
            document.getElementById('info-overlay').style.display = 'none';
            document.getElementById('loadingModal').style.display = 'none';
            document.querySelector('button[onclick="toggleDriveRoute()"]').textContent = "Drive Route";
        }

        // Route berechnen
        async function calculateCompleteRoute() {
            try {
                // Route von POI zu POI berechnen
                let allSegments = [];
                let routePOIs = [...poiCoordinates, {lat: 50.7852, lon: 7.0141, stopType: 'Home'}];
                
                for (let i = 0; i < routePOIs.length - 1; i++) {
                    let start = [routePOIs[i].lat, routePOIs[i].lon];
                    let end = [routePOIs[i + 1].lat, routePOIs[i + 1].lon];
                    
                    const segment = await calculateRouteSegment(start, end);
                    allSegments = allSegments.concat(segment.slice(i > 0 ? 1 : 0));
                }

                console.log(`Route calculated: ${allSegments.length} points`);
                document.getElementById('loadingModal').style.display = 'none';
                
                animateVanAlongRoute(allSegments, 0);
                
            } catch (error) {
                console.error("Route error:", error);
                document.getElementById('loadingModal').style.display = 'none';
            }
        }

        // Route Segment berechnen
        async function calculateRouteSegment(start, end) {
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?geometries=geojson&overview=full&annotations=true`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    
                    // Test für Elevation
                    if (route.legs && route.legs[0] && route.legs[0].annotation && route.legs[0].annotation.elevation) {
                        console.log('🎉 ELEVATION DATA FOUND!');
                    } else {
                        console.log('❌ No elevation data');
                    }
                    
                    return route.geometry.coordinates.map(coord => [coord[1], coord[0]]);
                } else {
                    return [start, end];
                }
            } catch (error) {
                console.error('Route error:', error);
                return [start, end];
            }
        }

        // Van Animation
        function animateVanAlongRoute(route, step) {
            if (step < route.length && driveRouteRunning) {
                var point = route[step];

                // Van Marker erstellen/bewegen
                if (!vanMarker) {
                    vanMarker = L.marker(point, {
                        icon: L.divIcon({
                            className: 'van-icon',
                            iconSize: [30, 30],
                            iconAnchor: [15, 15],
                            html: '<div style="background-color:#4a4a4a;color:white;width:30px;height:30px;display:flex;justify-content:center;align-items:center;border-radius:50%;"><i class="fas fa-shuttle-van"></i></div>'
                        })
                    }).addTo(map);
                } else {
                    vanMarker.setLatLng(point);
                }
                
                // Route zeichnen
                routePath.addLatLng(point);
                map.setView(point);

                // Distance tracking
                if (lastPosition) {
                    totalDistance += calculateDistance(lastPosition[0], lastPosition[1], point[0], point[1]) / 1000;
                }
                lastPosition = point;

                // POI Check
                checkPOIReached(point);

                // Info Update
                updateInfoOverlay();

                // Nächster Schritt
                var delay = Math.max(50, Math.min(500, 100));
                animationTimeout = setTimeout(function() {
                    animateVanAlongRoute(route, step + 1);
                }, delay);
                
            } else if (step >= route.length && driveRouteRunning) {
                console.log("Route completed!");
                setTimeout(stopDriveRoute, 2000);
            }
        }

        // POI Check (mit Elevation Update)
        var currentTime = null;
        function checkPOIReached(point) {
            for (let poi of poiCoordinates) {
                let distance = calculateDistance(poi.lat, poi.lon, point[0], point[1]);
                
                if (distance < 1000) {
                    let alreadyDisplayed = stopMarkers.some(m => 
                        calculateDistance(m.getLatLng().lat, m.getLatLng().lng, poi.lat, poi.lon) < 500
                    );
                    
                    if (!alreadyDisplayed) {
                        console.log(`POI reached: ${poi.stopType}`);
                        addStopMarker(poi);
                        currentTime = poi.time; // Zeit setzen
                        
                        // Elevation für POI setzen (mockup da OSRM keine hat)
                        currentElevation = poi.elevation || (200 + Math.random() * 800);
                        elevationData.push(currentElevation);
                        if (elevationData.length > 20) elevationData.shift();
                        updateElevationChart();
                    }
                }
            }
        }

        // Info Overlay Update (mit deutscher Zeitzone)
        function updateInfoOverlay() {
            if (currentTime) {
                // Deutsche Zeitzone (Bornheim)
                const options = { 
                    timeZone: 'Europe/Berlin',
                    day: '2-digit',
                    month: '2-digit', 
                    year: 'numeric'
                };
                const timeOptions = {
                    timeZone: 'Europe/Berlin',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                };
                
                document.getElementById('current-date').textContent = currentTime.toLocaleDateString('de-DE', options);
                document.getElementById('current-time').textContent = currentTime.toLocaleTimeString('de-DE', timeOptions);
            }
            document.getElementById('total-distance').textContent = totalDistance.toFixed(1);
            
            // Elevation Update
            if (currentElevation) {
                document.getElementById('current-elevation').textContent = currentElevation.toFixed(0);
            }
        }

        // Stop Marker hinzufügen
        function addStopMarker(poi) {
            const colors = {
                'Sleeping': '#8B4513',
                'Parking': '#4169E1',
                'Coffee Break': '#D2691E',
                'Home': '#228B22'
            };
            
            const icons = {
                'Sleeping': 'bed',
                'Parking': 'parking',
                'Coffee Break': 'coffee',
                'Home': 'home'
            };
            
            const color = colors[poi.stopType] || '#666666';
            const icon = icons[poi.stopType] || 'map-marker';
            
            const marker = L.marker([poi.lat, poi.lon], {
                icon: L.divIcon({
                    className: 'stop-marker',
                    iconSize: [20, 20],
                    html: `<div style="background-color:${color};color:white;width:20px;height:20px;display:flex;justify-content:center;align-items:center;border-radius:50%;"><i class="fas fa-${icon}"></i></div>`
                })
            }).addTo(map);
            
            stopMarkers.push(marker);
        }

        // Elevation Chart Update
        function updateElevationChart() {
            let chart = document.getElementById('elevation-chart');
            let canvas = chart.querySelector('canvas');
            if (!canvas) {
                canvas = document.createElement('canvas');
                canvas.width = 80;
                canvas.height = 60;
                chart.appendChild(canvas);
            }
            
            let ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 80, 60);
            
            if (elevationData.length > 1) {
                const minElev = Math.min(...elevationData);
                const maxElev = Math.max(...elevationData);
                const range = Math.max(maxElev - minElev, 10);
                
                // Grid
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.lineWidth = 0.5;
                for (let i = 1; i < 4; i++) {
                    const y = (i / 4) * 60;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(80, y);
                    ctx.stroke();
                }
                
                // Line
                ctx.strokeStyle = '#2196F3';
                ctx.lineWidth = 2;
                ctx.beginPath();
                
                for (let i = 0; i < elevationData.length; i++) {
                    let x = (i / (elevationData.length - 1)) * 80;
                    let y = 60 - ((elevationData[i] - minElev) / range) * 60;
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
                
                // Fill
                ctx.fillStyle = 'rgba(33, 150, 243, 0.2)';
                ctx.beginPath();
                ctx.moveTo(0, 60);
                for (let i = 0; i < elevationData.length; i++) {
                    let x = (i / (elevationData.length - 1)) * 80;
                    let y = 60 - ((elevationData[i] - minElev) / range) * 60;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(80, 60);
                ctx.closePath();
                ctx.fill();
                
                // Current point
                if (elevationData.length > 0) {
                    const currentX = 78;
                    const currentY = 60 - ((elevationData[elevationData.length - 1] - minElev) / range) * 60;
                    
                    ctx.fillStyle = '#FF5722';
                    ctx.beginPath();
                    ctx.arc(currentX, currentY, 2.5, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }
        }

        function filterData() {
            const startDateInput = document.getElementById('startDate').value;
            const endDateInput = document.getElementById('endDate').value;
            
            if (!startDateInput && !endDateInput) {
                console.log("Using all coordinates - no date filter applied");
                filteredCoordinates = [...coordinates];
                return;
            }
            
            const startDate = startDateInput ? new Date(startDateInput) : null;
            const endDate = endDateInput ? new Date(endDateInput) : null;
            
            if (endDate) {
                endDate.setHours(23, 59, 59, 999);
            }
            
            filteredCoordinates = coordinates.filter(coord => {
                const coordDate = new Date(coord.time);
                if (startDate && coordDate < startDate) return false;
                if (endDate && coordDate > endDate) return false;
                return true;
            });
            
            console.log(`Filtered to ${filteredCoordinates.length} coordinates`);
        }

        function updateParameters() {
            maxClusterDistance = parseInt(document.getElementById('maxClusterDistance').value);
            minTimeBetweenPOIs = parseInt(document.getElementById('minTimeBetweenPOIs').value) * 60 * 1000;
            sleepingThreshold = parseInt(document.getElementById('sleepingThreshold').value);
            parkingThreshold = parseInt(document.getElementById('parkingThreshold').value);
            coffeeBreakThreshold = parseInt(document.getElementById('coffeeBreakThreshold').value);
            maxMergeDistance = parseInt(document.getElementById('maxMergeDistance').value);

            console.log("Parameters updated, re-identifying POIs...");
            identifyPOIs();
        }
        // Distance berechnen
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            
            return R * c;
        }

        // GPS Daten laden
        function loadGPSData() {
            const csvData = `timestamp,latitude,longitude
2025-06-04 07:15:00,50.782766,7.018143
2025-06-04 08:30:00,50.782387,7.025217
2025-06-04 10:00:00,50.783576,7.031636
2025-06-04 18:45:00,50.783576,7.031636
2025-06-05 02:15:00,50.782009,7.032291
2025-06-05 15:30:00,50.782009,7.032291
2025-06-06 14:30:00,50.782009,7.032291
2025-06-07 09:15:00,51.456874,6.896550
2025-06-07 10:30:01,51.450622,6.906608
2025-06-07 16:45:00,51.450622,6.906608

2025-06-08 18:00:00,50.785200,7.014100
2025-06-09 09:00:00,50.785200,7.014100`;

            parseCSVData(csvData);
        }

        // CSV parsen
        function parseCSVData(csvData) {
            const lines = csvData.trim().split('\n');
            coordinates = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                const timestamp = new Date(values[0]);
                const lat = parseFloat(values[1]);
                const lon = parseFloat(values[2]);
                
                if (!isNaN(lat) && !isNaN(lon)) {
                    coordinates.push({
                        time: timestamp,
                        lat: lat,
                        lon: lon
                    });
                }
            }
            
            console.log(`Loaded ${coordinates.length} GPS points`);
            identifyPOIs();
        }

        // POIs identifizieren (mit konfigurierbaren Parametern)
        function identifyPOIs() {
            console.log(`Starting POI identification with ${coordinates.length} points`);
            
            poiCoordinates = [];
            let clusters = [];
            let currentCluster = null;
            
            for (let i = 0; i < coordinates.length - 1; i++) {
                const point1 = coordinates[i];
                const point2 = coordinates[i + 1];
                
                const distance = calculateDistance(point1.lat, point1.lon, point2.lat, point2.lon);
                const timeDiff = (point2.time - point1.time) / (1000 * 60); // minutes
                
                console.log(`Point ${i}: Distance to next = ${distance.toFixed(2)}m, Time diff = ${timeDiff.toFixed(2)}min`);
                
                if (distance <= maxClusterDistance) {
                    if (!currentCluster) {
                        currentCluster = {
                            points: [point1],
                            startTime: point1.time,
                            endTime: point1.time
                        };
                    }
                    currentCluster.points.push(point2);
                    currentCluster.endTime = point2.time;
                } else {
                    if (currentCluster) {
                        const duration = (currentCluster.endTime - currentCluster.startTime) / (1000 * 60);
                        const stopType = classifyStop(duration);
                        console.log(`Cluster ended. Duration: ${duration.toFixed(2)}min, Type: ${stopType}`);
                        
                        if (stopType !== 'Moving') {
                            const avgLat = currentCluster.points.reduce((sum, p) => sum + p.lat, 0) / currentCluster.points.length;
                            const avgLon = currentCluster.points.reduce((sum, p) => sum + p.lon, 0) / currentCluster.points.length;
                            
                            poiCoordinates.push({
                                lat: avgLat,
                                lon: avgLon,
                                duration: duration,
                                stopType: stopType,
                                time: currentCluster.startTime,
                                endTime: currentCluster.endTime
                            });
                            
                            console.log(`POI added: ${stopType} at ${avgLat}, ${avgLon}`);
                        }
                    }
                    currentCluster = null;
                }
            }
            
            // Letzter Cluster
            if (currentCluster) {
                const duration = (currentCluster.endTime - currentCluster.startTime) / (1000 * 60);
                const stopType = classifyStop(duration);
                console.log(`Last cluster. Duration: ${duration.toFixed(2)}min, Type: ${stopType}`);
                
                if (stopType !== 'Moving') {
                    const avgLat = currentCluster.points.reduce((sum, p) => sum + p.lat, 0) / currentCluster.points.length;
                    const avgLon = currentCluster.points.reduce((sum, p) => sum + p.lon, 0) / currentCluster.points.length;
                    
                    poiCoordinates.push({
                        lat: avgLat,
                        lon: avgLon,
                        duration: duration,
                        stopType: stopType,
                        time: currentCluster.startTime,
                        endTime: currentCluster.endTime
                    });
                }
            }
            
            console.log(`Identified ${poiCoordinates.length} POIs`);
            const poiTypeCount = {};
            poiCoordinates.forEach(poi => {
                poiTypeCount[poi.stopType] = (poiTypeCount[poi.stopType] || 0) + 1;
            });
            console.log(`POIs by class:`, poiTypeCount);
            
            // Map anpassen
            if (coordinates.length > 0) {
                const bounds = L.latLngBounds(coordinates.map(coord => [coord.lat, coord.lon]));
                map.fitBounds(bounds);
            }
        }

        function classifyStop(durationMinutes) {
            if (durationMinutes >= sleepingThreshold) {
                return 'Sleeping';
            } else if (durationMinutes >= parkingThreshold) {
                return 'Parking';
            } else if (durationMinutes >= coffeeBreakThreshold) {
                return 'Coffee Break';
            } else {
                return 'Moving';
            }
        }
