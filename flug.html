<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Van-Spur, Flug</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<style>
  html,body{margin:0;height:100%;background:#12141a;
            font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#e9e9e4}
  #map{position:absolute;inset:0}
  .karte{position:absolute;z-index:10;background:rgba(24,26,32,.92);border:1px solid #333842;
         border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
  #steuer{top:14px;left:14px;padding:12px 14px;width:250px}
  #steuer h1{font-size:14px;margin:0 0 10px;font-weight:600}
  label{display:block;font-size:12px;color:#9b9b93;margin:10px 0 4px}
  input[type=range]{width:100%;accent-color:#4d9463}
  button{font:inherit;font-weight:500;padding:9px 12px;border:1px solid transparent;border-radius:9px;
         background:#3d7a4e;color:#fff;cursor:pointer;width:100%}
  button:hover{background:#4d9463}
  button.still{background:#24262c;border-color:#333842;color:#e9e9e4}
  button.still.an{background:#3d7a4e;border-color:transparent;color:#fff}
  #belaege button+button{margin-top:0}
  button+button{margin-top:7px}
  .wert{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
  #anzeige{bottom:14px;left:50%;transform:translateX(-50%);padding:10px 18px;display:none;
           gap:22px;align-items:center;font-variant-numeric:tabular-nums}
  #anzeige.an{display:flex}
  #anzeige .gross{font-size:16px;font-weight:600}
  #anzeige .klein{font-size:11px;color:#9b9b93;text-transform:uppercase;letter-spacing:.04em}
  #lade{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
        flex-direction:column;gap:12px;background:#12141a}
  .balken{width:240px;height:4px;background:#333842;border-radius:3px;overflow:hidden}
  .balken i{display:block;height:100%;width:0;background:#4d9463;transition:width .25s}
  .hinw{font-size:12px;color:#9b9b93;max-width:420px;text-align:center;padding:0 20px}
</style>
</head>
<body>
<div id="map"></div>

<div id="steuer" class="karte">
  <h1>Flug über die Strecke</h1>
  <label>Dauer <span class="wert" id="dauerwert">40 s</span></label>
  <input type="range" id="dauer" min="1" max="6" value="3">
  <label>Karte</label>
  <div id="belaege" style="display:flex;gap:6px">
    <button class="still an" data-id="satellit" style="flex:1;padding:7px 4px;font-size:12px">Satellit</button>
    <button class="still" data-id="topo" style="flex:1;padding:7px 4px;font-size:12px">Topo</button>
    <button class="still" data-id="outdoor" style="flex:1;padding:7px 4px;font-size:12px">Outdoor</button>
  </div>
  <label>Kamerawinkel <span class="wert" id="winkelwert">70°</span></label>
  <input type="range" id="winkel" min="0" max="80" value="70">
  <label>Höhenüberhöhung <span class="wert" id="hoehewert">1,8×</span></label>
  <input type="range" id="hoehe" min="10" max="30" value="18">
  <div style="margin-top:12px">
    <button id="start">Flug starten</button>
    <button class="still" id="stopp">Stopp</button>
  </div>
</div>

<div id="anzeige" class="karte">
  <div><div class="klein">Zeit</div><div class="gross" id="aZeit">–</div></div>
  <div><div class="klein">Strecke</div><div class="gross" id="aKm">–</div></div>
  <div><div class="klein">Gelände</div><div class="gross" id="aHoehe">–</div></div>
  <div><div class="klein">Zuletzt</div><div class="gross" id="aNext">–</div></div>
</div>

<div id="fehlt" class="karte" hidden style="top:14px;left:280px;right:14px;padding:10px 14px;font-size:13px;color:#e0b070">
  Für diesen Abschnitt liegen keine Höhendaten neben der Seite, die Karte bleibt flach.
  Nachladen mit <code>werkzeug/hoehenkorridor.py</code>.
</div>

<div id="lade">
  <div id="ladetext">Gelände wird geladen</div>
  <div class="balken"><i id="ladebalken"></i></div>
  <div class="hinw" id="ladehinweis"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
<script src="analyse.js"></script>
<script>
(() => {
  'use strict';

  const SHEET = 'https://docs.google.com/spreadsheets/d/' +
    '13nN8lisfKRQHbD66J2pg1k5jN9lFz15ijwx0obu-03o/pub?gid=0&single=true&output=csv';

  // Hoehendaten direkt von AWS Open Data. Sie schicken sehr wohl
  // "Access-Control-Allow-Origin: *", man muss nur richtig hinsehen: ueber
  // HTTP/1.1 kommt der Headername grossgeschrieben zurueck.
  // Ein oertlicher Kachelordner laesst sich mit ?dem=lokal erzwingen, fuer
  // den Fall, dass man die Reise ohne Netz anschauen will.
  const P0 = new URLSearchParams(location.search);
  const DEM = P0.get('dem') === 'lokal'
    ? location.href.replace(/[^?#]*\//, m => m) .replace(/[^/]*$/, '') + 'dem/{z}/{x}/{y}.png'
    : 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
  const DEM_MAXZOOM = P0.get('dem') === 'lokal' ? 11 : 15;

  const DAUERN = [15, 25, 40, 60, 90, 150];
  const $ = id => document.getElementById(id);
  const P = new URLSearchParams(location.search);

  let karte, pfad = [], stops = [], raf = null, laeuft = false, gelaendeDaGlobal = true;

  const fmtUhr = d => d.toLocaleString('de-DE',
    {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const tausend = n => Math.round(n).toLocaleString('de-DE');

  /* ---------- Daten ---------- */
  async function daten(){
    const von = P.get('start') ? new Date(P.get('start')+'T00:00:00Z') : null;
    const bis = P.get('end')   ? new Date(P.get('end')+'T23:59:59Z')   : null;
    $('ladetext').textContent = 'Strecke wird berechnet';
    const csv = await (await fetch(SHEET)).text();
    const erg = await Analyse.lauf(csv, von, bis, (i,n) => {
      $('ladebalken').style.width = (i/n*100)+'%';
      $('ladetext').textContent = `Strecke wird berechnet (${i} von ${n})`;
    });

    let km = 0;
    for (const s of erg.segs){
      if (!s || s.art === 'steht') continue;
      const geo = s.geo?.length ? s.geo : [[s.a.lat,s.a.lon],[s.b.lat,s.b.lon]];
      const spanne = s.b.time - s.a.bis;
      for (let i = 0; i < geo.length; i++){
        if (i > 0) km += Analyse.meter({lat:geo[i-1][0],lon:geo[i-1][1]},
                                       {lat:geo[i][0],lon:geo[i][1]}) / 1000;
        pfad.push({ lat:geo[i][0], lon:geo[i][1], km,
                    zeit:new Date(+s.a.bis + spanne*i/(geo.length-1||1)) });
      }
    }
    stops = erg.stops;
    return erg;
  }

  /* ---------- Karte ---------- */
  // Farbverlauf, der die Linie bis zum Anteil f zeigt und danach verschwinden
  // laesst. Wird waehrend des Flugs als Lackeigenschaft gesetzt, was um ein
  // Vielfaches billiger ist als die Geometrie neu zu setzen.
  function verlauf(f, farbe, deckung){
    const durchsichtig = 'rgba(0,0,0,0)';
    const voll = deckung >= 1 ? farbe : farbe;
    if (f >= 1) return ['interpolate',['linear'],['line-progress'], 0, voll, 1, voll];
    if (f <= 0) return ['interpolate',['linear'],['line-progress'], 0, durchsichtig, 1, durchsichtig];
    const g = Math.min(f + 0.0015, 0.999);
    return ['interpolate',['linear'],['line-progress'],
            0, voll, f, voll, g, durchsichtig, 1, durchsichtig];
  }
  const NAME_KURZ = { pause:'Pause', halt:'Halt', 'langer-halt':'Längerer Halt',
                      uebernachtung:'Übernachtung', standtage:'Standtage' };

  // Jeder Aufenthalt bekommt seinen Streckenstand. Waehrend des Flugs gibt ihn
  // ein Filter frei, sobald die Drohne vorbei ist.
  const halteStand = new Map();
  function halteKmVon(h){
    if (halteStand.has(h)) return halteStand.get(h);
    let bi = 0, bd = Infinity;
    for (let i = 0; i < pfad.length; i++){
      const d = Analyse.meter(h, pfad[i]);
      if (d < bd){ bd = d; bi = i; }
    }
    const km = bd < 25000 ? pfad[bi].km : 1e9;
    halteStand.set(h, km);
    return km;
  }
  let halteKm = [];
  function halteEinmessen(){
    halteKm = stops.map(h => ({ halt:h, km: halteKmVon(h) }))
                   .filter(x => x.km < 1e9).sort((a,b) => a.km - b.km);
  }

  const kachelX = (lon, z) => Math.floor((lon + 180) / 360 * 2**z);
  const kachelY = (lat, z) => {
    const r = lat * Math.PI / 180;
    return Math.floor((1 - Math.log(Math.tan(r) + 1/Math.cos(r)) / Math.PI) / 2 * 2**z);
  };

  // Drei Belaege, wie im Schwesterprojekt vantrip. Satellit gibt dem Flug die
  // meiste Haptik, Topografisch zeigt Hoehenlinien, Outdoor ist ein Vektorstil
  // mit Schummerung und bleibt beim Kippen scharf.
  const BELAEGE = {
    satellit: { name:'Satellit', stil: {
      version:8, sources:{ sat:{ type:'raster', tileSize:256, maxzoom:18,
        tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        attribution:'Luftbilder &copy; Esri' } },
      layers:[{ id:'sat', type:'raster', source:'sat' }] } },
    topo: { name:'Topografisch', stil: {
      version:8, sources:{ topo:{ type:'raster', tileSize:256, maxzoom:16,
        tiles:['https://a.tile.opentopomap.org/{z}/{x}/{y}.png',
               'https://b.tile.opentopomap.org/{z}/{x}/{y}.png',
               'https://c.tile.opentopomap.org/{z}/{x}/{y}.png'],
        attribution:'&copy; OpenStreetMap, SRTM | &copy; OpenTopoMap (CC-BY-SA)' } },
      layers:[{ id:'topo', type:'raster', source:'topo' }] } },
    outdoor: { name:'Outdoor', stil:'https://tiles.openfreemap.org/styles/liberty', schummer:true }
  };

  let belag = P0.get('belag') && BELAEGE[P0.get('belag')] ? P0.get('belag') : 'satellit';

  // Gelaende, Himmel, Strecke und Aufenthalte haengen nicht am Belag und
  // muessen nach jedem Stilwechsel neu gesetzt werden.
  function ebenenSetzen(gelaendeDa){
    if (!karte.getSource('gelaende'))
      karte.addSource('gelaende', { type:'raster-dem', tileSize:256, maxzoom:DEM_MAXZOOM,
        encoding:'terrarium', tiles:[DEM],
        attribution:'Höhendaten: Terrain Tiles (AWS Open Data)' });
    if (gelaendeDa) karte.setTerrain({ source:'gelaende', exaggeration:+$('hoehe').value/10 });

    // MapLibre kennt keine sky-Ebene wie Mapbox, sondern setSky.
    karte.setSky({ 'sky-color':'#4b8fd6', 'horizon-color':'#e4eef7',
                   'fog-color':'#eef4f9', 'sky-horizon-blend':0.5,
                   'horizon-fog-blend':0.6, 'fog-ground-blend':0.15,
                   'atmosphere-blend':['interpolate',['linear'],['zoom'],0,1,10,0.6,13,0] });

    if (BELAEGE[belag].schummer && !karte.getLayer('schummer'))
      karte.addLayer({ id:'schummer', type:'hillshade', source:'gelaende',
        paint:{ 'hillshade-exaggeration':0.5, 'hillshade-shadow-color':'#473b24',
                'hillshade-illumination-anchor':'map' } });

    // lineMetrics erlaubt es, die Linie ueber einen Farbverlauf freizugeben,
    // statt ihre Geometrie staendig neu zu setzen. Das Neusetzen liess die
    // Strecke in Brocken erscheinen.
    if (!karte.getSource('strecke'))
      karte.addSource('strecke', { type:'geojson', lineMetrics:true, data:{ type:'Feature',
        geometry:{ type:'LineString', coordinates: pfad.map(p => [p.lon, p.lat]) } } });
    if (!karte.getLayer('strecke-schatten'))
      karte.addLayer({ id:'strecke-schatten', type:'line', source:'strecke',
        layout:{ 'line-cap':'round', 'line-join':'round' },
        paint:{ 'line-width':11, 'line-blur':5, 'line-gradient':verlauf(1, '#08131f', .45) } });
    if (!karte.getLayer('strecke'))
      karte.addLayer({ id:'strecke', type:'line', source:'strecke',
        layout:{ 'line-cap':'round', 'line-join':'round' },
        paint:{ 'line-width':5, 'line-gradient':verlauf(1, '#46b1ff', 1) } });

    if (!karte.getSource('halte'))
      karte.addSource('halte', { type:'geojson', data:{ type:'FeatureCollection',
        features: stops.map(h => ({ type:'Feature',
          properties:{ art:h.art, km: halteKmVon(h) },
          geometry:{ type:'Point', coordinates:[h.lon, h.lat] } })) } });
    if (!karte.getLayer('halte'))
      karte.addLayer({ id:'halte', type:'circle', source:'halte',
        paint:{ 'circle-radius':8, 'circle-stroke-width':2.5, 'circle-stroke-color':'#fff',
          'circle-color':['match',['get','art'],
            'pause','#d4941f','halt','#cc6a2c','langer-halt','#cc6a2c',
            'uebernachtung','#6b52b5','standtage','#a33b3b','#888'] } });
  }

  function initKarte(gelaendeDa){
    karte = new maplibregl.Map({
      container:'map', style: BELAEGE[belag].stil,
      center:[pfad[0].lon, pfad[0].lat], zoom:12,
      pitch:+$('winkel').value, bearing:0, maxPitch:85,
      attributionControl:{ compact:true }
    });
    return new Promise(fertig => {
      karte.on('load', () => { ebenenSetzen(gelaendeDa); fertig(); });
    });
  }

  function belagWechseln(id, gelaendeDa){
    if (id === belag) return;
    belag = id;
    const mitte = karte.getCenter(), z = karte.getZoom(),
          n = karte.getPitch(), r = karte.getBearing();
    karte.setStyle(BELAEGE[id].stil);
    karte.once('style.load', () => {
      karte.jumpTo({ center:mitte, zoom:z, pitch:n, bearing:r });
      ebenenSetzen(gelaendeDa);
    });
    for (const el of document.querySelectorAll('#belaege button'))
      el.classList.toggle('an', el.dataset.id === id);
  }

  /* ---------- Flug ---------- */

  /* Eine echte Drohne folgt nicht jeder Kurve der Strasse. Die Kamera bekommt
     deshalb eine eigene, geglaettete Bahn: gleitender Mittelwert ueber ein
     Streckenfenster. Die gezeichnete Strecke bleibt davon unberuehrt und liegt
     weiter exakt auf der Strasse. */
  function glaetten(punkte, fensterKm){
    const aus = new Array(punkte.length);
    let von = 0, bis = 0, sLat = 0, sLon = 0, n = 0;
    for (let i = 0; i < punkte.length; i++){
      const k = punkte[i].km;
      while (bis < punkte.length && punkte[bis].km <= k + fensterKm){
        sLat += punkte[bis].lat; sLon += punkte[bis].lon; n++; bis++;
      }
      while (punkte[von].km < k - fensterKm){
        sLat -= punkte[von].lat; sLon -= punkte[von].lon; n--; von++;
      }
      aus[i] = { lat: sLat/n, lon: sLon/n, km: k };
    }
    return aus;
  }

  // Position auf einer Bahn zu einem Streckenstand.
  // Binaere Suche statt linearem Durchlauf: mit voller Strassengeometrie sind
  // es zehntausende Stuetzpunkte, und die Funktion laeuft dreimal je Bild.
  function aufBahn(bahn, km){
    let lo = 0, hi = bahn.length - 1;
    while (lo < hi){
      const m = (lo + hi + 1) >> 1;
      if (bahn[m].km <= km) lo = m; else hi = m - 1;
    }
    const a = bahn[lo], b = bahn[Math.min(lo + 1, bahn.length - 1)];
    const f = Math.max(0, Math.min((km - a.km) / ((b.km - a.km) || 1), 1));
    return { lat: a.lat + (b.lat-a.lat)*f, lon: a.lon + (b.lon-a.lon)*f, i: lo };
  }

  function peilung(a, b){
    const y = Math.sin((b.lon-a.lon)*Math.PI/180) * Math.cos(b.lat*Math.PI/180);
    const x = Math.cos(a.lat*Math.PI/180)*Math.sin(b.lat*Math.PI/180) -
              Math.sin(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.cos((b.lon-a.lon)*Math.PI/180);
    return (Math.atan2(y,x)*180/Math.PI + 360) % 360;
  }
  const kurz = w => ((w + 540) % 360) - 180;   // kuerzester Winkelweg

  /* Kameraführung.

     Zwei Fehler der Vorfassung:

     1. Die Kamera sass auf einer Zoomstufe, nicht auf einer Hoehe. MapLibre
        leitet daraus zwar eine Hoehe ab, die weiss aber nichts vom Gelaende.
        Bei 1,8-facher Ueberhoehung ragen Gipfel dann durchs Bild.

     2. Sie folgte der geglaetteten Strassengeometrie. Eine Drohne fliegt keine
        Serpentinen, sie fliegt die grobe Linie und laesst die Strasse unter
        sich maeandern.

     Jetzt: eine eigene Bahn aus weit gesetzten Stuetzpunkten, dazwischen
     Catmull-Rom. Gegen das Durchfliegen der Berge wird das Gelaende voraus
     abgetastet; steigt es an, geht die Kamera hoeher und richtet sich flacher
     aus. Eine freie Kamera mit echter Hoehenangabe waere sauberer, die gibt es
     in MapLibre aber nicht, auch nicht in Fassung 5 oder 6. */

  // Catmull-Rom zwischen vier Stuetzpunkten
  function crom(p0, p1, p2, p3, t){
    const t2 = t*t, t3 = t2*t;
    const f = (a,b,c,d) => 0.5 * ((2*b) + (-a+c)*t + (2*a-5*b+4*c-d)*t2 + (-a+3*b-3*c+d)*t3);
    return { lat: f(p0.lat,p1.lat,p2.lat,p3.lat), lon: f(p0.lon,p1.lon,p2.lon,p3.lon) };
  }

  /* Die Drohnenbahn: die Strecke weit abtasten, dann weich durchziehen. Aus
     zehntausenden Strassenpunkten werden so einige Dutzend Wegpunkte. */
  function drohnenbahn(punkte, abstandKm){
    const stuetz = [punkte[0]];
    let naechst = abstandKm;
    for (const p of punkte){
      if (p.km >= naechst){ stuetz.push(p); naechst = p.km + abstandKm; }
    }
    if (stuetz[stuetz.length-1] !== punkte[punkte.length-1]) stuetz.push(punkte[punkte.length-1]);
    if (stuetz.length < 4) return punkte.map(p => ({lat:p.lat, lon:p.lon, km:p.km}));

    const bahn = [];
    const hol = i => stuetz[Math.max(0, Math.min(i, stuetz.length-1))];
    for (let i = 0; i < stuetz.length - 1; i++){
      const a = hol(i-1), b = hol(i), c = hol(i+1), d = hol(i+2);
      const schritte = 24;
      for (let k = 0; k < schritte; k++){
        const t = k / schritte;
        const q = crom(a, b, c, d, t);
        bahn.push({ lat:q.lat, lon:q.lon, km: b.km + (c.km - b.km) * t });
      }
    }
    bahn.push({ lat:stuetz[stuetz.length-1].lat, lon:stuetz[stuetz.length-1].lon,
                km:stuetz[stuetz.length-1].km });
    return bahn;
  }

  /* Die Zoomstufe ergibt sich aus der Bodengeschwindigkeit: die Landschaft
     soll immer mit rund derselben Pixelzahl je Sekunde vorbeiziehen. Schnell
     fliegen heisst damit hoch fliegen, langsam heisst tief. */
  const ZIEL_PX_PRO_S = 230;

  function flughoehe(mProSek, lat){
    const mProPixel = mProSek / ZIEL_PX_PRO_S;
    const z = Math.log2(156543.03 * Math.cos(lat * Math.PI/180) / mProPixel);
    return Math.max(9.2, Math.min(z, 14.5));
  }

  function flugStart(){
    flugStopp();
    if (pfad.length < 2) return;
    laeuft = true;
    $('anzeige').classList.add('an');
    $('start').textContent = 'Fliegt …';
    $('start').disabled = true;

    const gesamtKm = pfad[pfad.length-1].km || 1;
    const dauerMs = DAUERN[+$('dauer').value - 1] * 1000;
    const tempo = gesamtKm * 1000 / (dauerMs / 1000);       // Meter je Sekunde

    // Grobe Bahn: ein Stuetzpunkt etwa alle 3,5 Prozent der Strecke, mindestens
    // alle 12 km. Je weiter auseinander, desto weniger Seitwaertsbewegung.
    const bahn = drohnenbahn(pfad, Math.max(gesamtKm / 28, 12));

    // Grundhoehe der Kamera aus dem Tempo: die Landschaft soll immer mit
    // rund derselben Pixelzahl je Sekunde vorbeiziehen.
    const basisZoom  = flughoehe(tempo, pfad[0].lat);
    const basisPitch = +$('winkel').value;
    const VORLAUF = Math.max(gesamtKm / 40, 4);            // km, Blickpunkt voraus

    let richtung = null, zoomAkt = basisZoom, pitchAkt = basisPitch;
    let t0 = 0, letzteKamera = 0, letzterStrich = 0, erreicht = 0, grundAkt = null;

    strichSetzen(0);
    if (karte.getLayer('halte')) karte.setFilter('halte', ['<=', ['get','km'], 0]);

    const grund = (p) => {
      const h = karte.queryTerrainElevation({ lng:p.lon, lat:p.lat });
      return (h != null && h > -500 && h < 9000) ? h : null;
    };

    const schritt = (jetzt) => {
      if (!laeuft) return;
      if (!t0) t0 = jetzt;
      const anteil = Math.min((jetzt - t0) / dauerMs, 1);
      const km = anteil * gesamtKm;

      const fahrzeug = aufBahn(pfad, km);
      const kam   = aufBahn(bahn, km);
      const blick = aufBahn(bahn, Math.min(km + VORLAUF, gesamtKm));

      if (jetzt - letzteKamera > 28){
        letzteKamera = jetzt;

        // Gelaende weit voraus abtasten, nicht nur bis zum Blickziel. Ein
        // kurzer Horizont laesst die Kamera ueber jeden Grat wippen; ueber
        // einen langen steigt sie einmal vor dem Gebirge und bleibt oben.
        const hier = grund(kam);
        let vorn = 0;
        for (const f of [.2, .5, .9, 1.4, 2.0, 2.8]){
          const g = grund(aufBahn(bahn, Math.min(km + VORLAUF * f, gesamtKm)));
          if (g != null && g > vorn) vorn = g;
        }
        if (hier != null) grundAkt = hier;
        const relief = Math.max(0, vorn - (hier ?? 0)) * (+$('hoehe').value / 10);

        // Kleinere Ausschlaege als zuvor, und eine Sperrklinke: steigen darf
        // sie zuegig, sinken nur sehr langsam. Das nimmt das Auf und Ab heraus.
        const zielZoom  = basisZoom  - Math.min(relief / 1100, 0.8);
        const zielPitch = basisPitch - Math.min(relief / 160, 7);
        const rauf = zielZoom < zoomAkt;                  // kleinerer Zoom heisst hoeher
        zoomAkt  += (zielZoom  - zoomAkt)  * (rauf ? 0.02 : 0.004);
        pitchAkt += (zielPitch - pitchAkt) * (zielPitch < pitchAkt ? 0.02 : 0.004);

        const soll = peilung(kam, blick);
        richtung = richtung === null ? soll : richtung + kurz(soll - richtung) * 0.028;

        karte.jumpTo({ center:[kam.lon, kam.lat], zoom:zoomAkt,
                       pitch:pitchAkt, bearing:richtung });
      }

      if (jetzt - letzterStrich > 45){
        letzterStrich = jetzt;
        strichSetzen(anteil);
        if (karte.getLayer('halte')) karte.setFilter('halte', ['<=', ['get','km'], km]);
      }

      while (erreicht < halteKm.length && halteKm[erreicht].km <= km){
        $('aNext').textContent = NAME_KURZ[halteKm[erreicht].halt.art] || '';
        erreicht++;
      }

      $('aZeit').textContent = fmtUhr(pfad[fahrzeug.i].zeit);
      $('aKm').textContent = tausend(km) + ' km';
      $('aHoehe').textContent = grundAkt != null ? tausend(grundAkt) + ' m' : '–';

      if (anteil >= 1){ flugEnde(); return; }
      raf = requestAnimationFrame(schritt);
    };
    raf = requestAnimationFrame(schritt);
  }

  function strichSetzen(anteil){
    if (!karte?.getLayer('strecke')) return;
    karte.setPaintProperty('strecke', 'line-gradient', verlauf(anteil, '#46b1ff', 1));
    karte.setPaintProperty('strecke-schatten', 'line-gradient', verlauf(anteil, '#08131f', .45));
  }

  function flugEnde(){
    laeuft = false;
    if (raf){ cancelAnimationFrame(raf); raf = null; }
    $('anzeige').classList.remove('an');
    $('start').textContent = 'Flug starten';
    $('start').disabled = false;
    // Danach wieder alles zeigen
    strichSetzen(1);
    if (karte.getLayer('halte')) karte.setFilter('halte', null);
  }

  function flugStopp(){
    if (!laeuft){ return; }
    flugEnde();
  }

  /* ---------- Start ---------- */
  (async () => {
    try {
      await daten();
      if (!pfad.length) throw new Error('keine Strecke im Zeitraum');
      $('ladetext').textContent = 'Gelände wird geladen';

      // Nur beim oertlichen Kachelordner pruefen, ob ueberhaupt etwas da liegt.
      // Die Fernquelle ist immer da, und sie erlaubt per CORS ausschliesslich
      // GET; ein HEAD scheitert dort und wuerde faelschlich "fehlt" melden.
      let gelaendeDa = true;
      if (P0.get('dem') === 'lokal'){
        const probe = DEM.replace('{z}','8')
          .replace('{x}', String(kachelX(pfad[0].lon, 8)))
          .replace('{y}', String(kachelY(pfad[0].lat, 8)));
        gelaendeDa = false;
        try { gelaendeDa = (await fetch(probe)).ok; } catch(e){}
      }

      gelaendeDaGlobal = gelaendeDa;
      await initKarte(gelaendeDa);
      halteEinmessen();
      $('lade').style.display = 'none';
      if (!gelaendeDa) $('fehlt').hidden = false;
    } catch(e){
      $('ladetext').textContent = 'Fehlgeschlagen: ' + e.message;
      return;
    }

    $('start').onclick = flugStart;
    $('stopp').onclick = () => flugStopp();
    $('dauer').oninput = () => $('dauerwert').textContent = DAUERN[+$('dauer').value-1] + ' s';
    $('winkel').oninput = () => {
      $('winkelwert').textContent = $('winkel').value + '°';
      karte.setPitch(+$('winkel').value);
    };
    $('hoehe').oninput = () => {
      $('hoehewert').textContent = (+$('hoehe').value/10).toFixed(1).replace('.',',') + '×';
      if (karte.getTerrain()) karte.setTerrain({ source:'gelaende', exaggeration:+$('hoehe').value/10 });
    };
    for (const el of document.querySelectorAll('#belaege button'))
      el.onclick = () => belagWechseln(el.dataset.id, gelaendeDaGlobal);
    window.flug = { karte, pfad, stops };
  })();
})();
</script>
